/* ---------- Game 3: Kisi Operasi (cross math) ----------
   Kisi 3 × 3 dengan 12 slot operasi. Beberapa slot sudah terisi (seperti angka awal sudoku);
   pemain mengisi sisanya satu per satu sampai semua baris dan kolom benar. Dihitung dari kiri/atas. */
const OPS={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,'÷':(a,b)=>a/b};
function kisiInt(g,o){ for(let i=0;i<3;i++){ const r1=OPS[o['h'+i+'0']](g[i][0],g[i][1]), c1=OPS[o['v'+i+'0']](g[0][i],g[1][i]); if(!Number.isInteger(r1)||!Number.isInteger(c1)) return false; } const e=kisiEval(g,o); return e.r.concat(e.c).every(Number.isInteger); }
const KSLOTS=[]; for(let i=0;i<3;i++) for(let j=0;j<2;j++){ KSLOTS.push('h'+i+j); KSLOTS.push('v'+i+j); }
function kisiEval(g,o){ const r=[0,1,2].map(i=>OPS[o['h'+i+'1']](OPS[o['h'+i+'0']](g[i][0],g[i][1]),g[i][2])), c=[0,1,2].map(j=>OPS[o['v'+j+'1']](OPS[o['v'+j+'0']](g[0][j],g[1][j]),g[2][j])); return {r,c}; }
const KISI_LV={1:{nama:'Mudah',ops:7,angka:0},2:{nama:'Sedang',ops:5,angka:0},3:{nama:'Sulit',ops:3,angka:1}};
function kisiItem(lv,vid){
  const L0=KISI_LV[lv||1]||KISI_LV[1], L=vid==='angka'?{nama:L0.nama,ops:12,angka:L0.angka+2}:L0, bagi=vid==='bagi', ok=bagi?['+','−','×','÷']:['+','−','×'];
  const mxD=(lv||1)===1?5:(lv||1)===2?6:7, mxR=(lv||1)===1?25:(lv||1)===2?30:40;
  for(let t=0;t<(bagi?8000:600);t++){ const g=[0,1,2].map(()=>[0,1,2].map(()=>RN.int(1,mxD))), o={}; KSLOTS.forEach(k=>o[k]=RN.pick(ok));
    if(bagi&&(!KSLOTS.some(k=>o[k]==='÷')||!kisiInt(g,o))) continue;
    const ev=kisiEval(g,o); if(ev.r.concat(ev.c).some(v=>v<0||v>mxR)) continue;
    const fx={}; RN.shuf(KSLOTS.slice()).slice(0,L.ops).forEach(k=>fx[k]=o[k]);
    const hid=RN.shuf([0,1,2,3,4,5,6,7,8]).slice(0,L.angka).map(x=>[Math.floor(x/3),x%3]);
    const isHid=(i,j)=>hid.some(h=>h[0]===i&&h[1]===j);
    return {perintah:'Kisi operasi ('+L.nama+')', kisi:{g,rows:ev.r,cols:ev.c,fixed:fx,sol:o,hid,lv:lv||1,ops:ok}, kunci:0,
      check:K=>{ const s=Object.assign({},fx,K.st.ops||{}); if(KSLOTS.some(k=>!s[k])) return false; const nn=K.st.nums||{};
        const gg=g.map((r,i)=>r.map((v,j)=>isHid(i,j)?nn[i+''+j]:v)); if(gg.some(r=>r.some(v=>!(v>=1&&v<=9)))) return false;
        const e=kisiEval(gg,s); if(!kisiInt(gg,s)) return false; return e.r.every((v,i)=>v===ev.r[i])&&e.c.every((v,i)=>v===ev.c[i]); },
      langkah:['Mulai dari baris atau kolom yang paling banyak terisi.',
        'Contoh jawaban: '+[0,1,2].map(i=>'('+g[i][0]+' '+o['h'+i+'0']+' '+g[i][1]+') '+o['h'+i+'1']+' '+g[i][2]+' = '+fmt(ev.r[i])).join('; ')+'.',
        'Susunan lain juga diterima selama semua baris dan kolom benar.']}; }
  return null;
}

/* ---------- Game 4: Detektif Barisan ---------- */
const BV={
  tengah:()=>{ let t, why; if(RN.chance(.6)){ const d=RN.pick([-1,1,1])*RN.int(2,6), a=d>0?RN.int(2,20):RN.int(7*(-d)+2,50); t=[]; for(let i=0;i<7;i++) t.push(a+i*d); why='Beda tetap '+sg(d); }
      else { const a=RN.int(1,3), r=2; t=[]; for(let i=0;i<6;i++) t.push(a*Math.pow(r,i)); why='Rasio tetap × '+r; }
    const k=RN.int(2,t.length-3), cells=t.map((v,i)=>i===k?{q:1}:{v});
    return {perintah:'Suku yang hilang: '+t.map((v,i)=>i===k?'…':fmt(v)).join(', '),kp:1,bar:{tag:'Cari suku yang hilang',cells},kunci:t[k],langkah:[why,'Suku ke-'+(k+1)+' = '+fmt(t[k])]}; },
  tingkat:()=>{ const a=RN.int(1,5), d0=RN.int(1,3), e=1, t=[a]; for(let i=1;i<7;i++) t.push(t[i-1]+d0+(i-1)*e); const ds=t.slice(1).map((v,i)=>v-t[i]);
    return {perintah:'Lanjutkan: '+t.slice(0,6).map(fmt).join(', ')+', …',kp:1,bar:{cells:t.slice(0,6).map(v=>({v})).concat([{q:1}])},kunci:t[6],langkah:['Selisih: '+ds.slice(0,5).join(', ')+' (naik '+e+')','Selisih berikutnya '+ds[5]+', jadi '+fmt(t[5])+' + '+ds[5]+' = '+fmt(t[6])]}; },
  fibo:()=>{ const t=[RN.int(1,3),RN.int(1,3)]; for(let i=2;i<7;i++) t.push(t[i-1]+t[i-2]);
    return {perintah:'Lanjutkan: '+t.slice(0,6).map(fmt).join(', ')+', …',kp:1,bar:{cells:t.slice(0,6).map(v=>({v})).concat([{q:1}])},kunci:t[6],langkah:['Tiap suku = jumlah dua suku sebelumnya','Suku ke-7 = '+t[4]+' + '+t[5]+' = '+t[6]]}; },
  kesuku:()=>{ const a=RN.int(1,9), d=RN.int(2,4), n=RN.int(10,15), v=a+(n-1)*d;
    return {perintah:'Suku ke-'+n+' dari '+[0,1,2,3,4].map(i=>a+i*d).join(', ')+', …',kp:1,bar:{tag:'Suku ke-'+n,cells:[0,1,2,3,4].map(i=>({v:a+i*d})).concat([{blank:1},{q:1,ix:n}])},kunci:v,langkah:['Beda '+d,'U'+n+' = '+a+' + ('+n+' − 1) × '+d+' = '+v]}; }
};
function barisanItem(i,vid){
  if(BV[vid]) return BV[vid]();
  const MO={selang:0,bergantian:1,salah:2,mundur:3}, mode=vid in MO?MO[vid]:RN.int(0,3);

function rTxt(a,b){ return (a===1?'':a)+'x'+(b?(b<0?' − '+(-b):' + '+b):''); }
function linRule(){
  if(RN.chance(.8)){ const a=RN.int(2,3); let b=RN.pick([-2,-1,1,2,3,4,5]);
    return {a,b,f:x=>a*x+b,t:rTxt(a,b),mt:y=>'('+fmt(y)+(b<0?' + '+(-b):' − '+b)+') ÷ '+a+' = '+fmt((y-b)/a)}; }

function mPairs(r,n,lo,hi){ const xs=[]; for(let x=lo;x<=hi;x++) xs.push(x); return RN.shuf(xs).slice(0,n).sort((a,b)=>a-b).map(x=>[x,r.f(x)]); }

const MV={
  maju:()=>{ const R=[linRule]; if(has('BIL-15')) R.push(()=>{ let b=RN.int(1,4); return {f:x=>x*x+b,t:'x² '+(b<0?'− '+(-b):'+ '+b)}; });

    return {ask:'Output untuk '+x0+'?',perintah:'Mesin: '+plTxt(P)+'. Output untuk input '+x0+'?',kp:1,mesin:{pairs:P,x:x0,y:null,rule:r.t},kunci:r.f(x0),langkah:['Aturan mesin: '+r.t,'Input '+x0+' → '+fmt(r.f(x0))]}; },
  mundur:()=>{ const r=linRule(), P=mSeq(r,3), x0=RN.int(5,9), y=r.f(x0);
    return {ask:'Input untuk '+fmt(y)+'?',perintah:'Mesin: '+plTxt(P)+'. Input berapa yang menghasilkan '+fmt(y)+'?',kp:1,mesin:{pairs:P,x:null,y,rule:r.t},kunci:x0,langkah:['Aturan mesin: '+r.t,'Jalankan mundur dengan operasi kebalikan, urutannya dari belakang','x = '+r.mt(y)]}; },
  cerita:()=>{ const c=RN.pick(MCTX), a=RN.int(c.a[0],c.a[1]), b=RN.int(c.b[0],c.b[1]), r={f:x=>a*x+b,t:rTxt(a,b)}, P=mSeq(r,3), x0=RN.int(5,8), y=r.f(x0), back=RN.chance(.3);
    const st=['Setiap '+c.iu+' bertambah 1, '+c.ou+' bertambah '+a+'. Bila '+c.iu+' = 0, nilainya '+b,'Aturannya: '+r.t];
    return back?{ask:fmt(y)+' '+c.ou+' → berapa '+c.iu+'?',perintah:c.c+': '+plTxt(P)+'. Bila output '+fmt(y)+', inputnya?',kp:1,mesin:{pairs:P,x:null,y,rule:r.t,ctx:c},kunci:x0,langkah:st.concat(['('+fmt(y)+' − '+b+') ÷ '+a+' = '+x0])}
      :{ask:x0+' '+c.iu+' → berapa '+c.ou+'?',perintah:c.c+': '+plTxt(P)+'. Untuk input '+x0+', outputnya?',kp:1,mesin:{pairs:P,x:x0,y:null,rule:r.t,ctx:c},kunci:y,langkah:st.concat([a+' × '+x0+' + '+b+' = '+fmt(y)])}; },
  salah:()=>{ const r=linRule(), P=mSeq(r,4), k=RN.int(1,3), off=RN.pick([-3,-2,2,3]), sh=P.map(p=>p.slice()); sh[k][1]+=off;
    return {ask:'Satu pasangan salah. Ketuk, lalu ketik yang benar.',perintah:'Mesin: '+plTxt(sh)+'. Satu pasangan salah catat. Output yang benar?',kp:1,needSel:k,mesin:{pairs:sh,pick:1,x:null,y:null,rule:r.t},kunci:P[k][1],
      langkah:['Tiga pasangan lain cocok dengan aturan '+r.t,'Input '+P[k][0]+' seharusnya → '+fmt(P[k][1])+', bukan '+fmt(sh[k][1])]}; },
  berantai:()=>{ const a1=2, b1=RN.int(1,3), a2=1; let b2=RN.pick([1,2,3,4,5,-1,-2]);
    const A={f:x=>a1*x+b1,t:rTxt(a1,b1)}, B={f:x=>a2*x+b2,t:rTxt(a2,b2)}, x0=RN.int(1,3), mid=A.f(x0), out=B.f(mid);
    return {ask:'Lewat A, lalu B. Output akhir?',perintah:'Dua mesin berantai (A: '+A.t+', B: '+B.t+'). Input '+x0+' lewat A lalu B, output akhirnya?',kp:1,mesin:{chain:[{lab:'A',pairs:mSeq(A,3),rule:A.t},{lab:'B',pairs:mSeq(B,3),rule:B.t}],x:x0,y:null},kunci:out,

  aturan:()=>{ const a=RN.int(2,4), b=RN.int(1,5); const r={f:x=>a*x+b,t:rTxt(a,b)}, P=mSeq(r,3), [x1,y1]=P[0], [x2,y2]=P[1];

  mustahil:()=>{ const a=RN.int(2,3), b=RN.int(1,a-1), r={f:x=>a*x+b,t:rTxt(a,b)}, P=mSeq(r,3);
    const ok=RN.shuf([4,5,6,7,8,9,10]).slice(0,4).map(r.f); let v; do{ v=RN.int(4*a,10*a); }while(v%a===b||ok.includes(v));
    const o=ok.concat([v]).sort((p,q)=>p-q), k=o.indexOf(v);
    return {ask:'x bulat positif. Output yang TIDAK mungkin?',perintah:'Mesin: '+plTxt(P)+'. Output yang TIDAK mungkin?',mesin:{pairs:P,opt:1,rule:r.t},opsi:o.map(fmt),kunci:k,

};

function gameBentuk(id,max){ const L=(GVAR[id]||[]).filter(v=>!v.need||has(...v.need)); if(!L.length) return null;
  const k=ymd(new Date()); S.gday=S.gday||{}; S.gseen=S.gseen||{}; const cur=S.gday[id];
  if(cur&&cur.k===k){ const l=cur.ids.map(x=>L.find(v=>v.id===x)); if(l.every(Boolean)) return l; }
  const last=S.gseen[id]||{}, sc={}; L.forEach(v=>{ sc[v.id]=(last[v.id]==null?-1e4:last[v.id])+Math.random(); });
  const t=tahap('PK'), fill=t===1?['geser','lama','baru']:t===2?['geser','baru','lama']:['baru','geser','lama'];
  const out=[], best=j=>L.filter(v=>v.j===j&&!out.includes(v)).sort((a,b)=>sc[a.id]-sc[b.id])[0];
  ['lama','geser','baru'].forEach(j=>{ const v=best(j); if(v) out.push(v); });
  while(out.length<Math.min(max||4,L.length)){ let v=null; for(const j of fill){ v=best(j); if(v) break; } if(!v) break; out.push(v); }
  const d=dayNo(); out.forEach(v=>{ last[v.id]=d; }); S.gseen[id]=last; S.gday[id]={k,ids:out.map(v=>v.id)}; save(); return out; }

    return '<details class="card rev fold '+(a.ok?'good':'wrong')+'"><summary><span class="num">'+(i+1)+'</span>'+badge(q.sub)+'<span class="grow snip1">'+esc(q.perintah.slice(0,70))+'</span><span class="sm">'+(a.ok?'benar':'salah')+' · '+Math.round(R.T[i]/1000)+' dtk'+(slow?' (lambat)':'')+'</span>'+CHEVI+'</summary>'+
    q.teks.map(p=>'<p>'+txt(p)+'</p>').join('')+tabel(q.tabel)+'<p class="ask">'+txt(q.perintah)+'</p>'+
    (q.tipe==='pg'?'<ul class="ol">'+q.opsi.map((o,j)=>'<li class="'+(j===q.kunci?'k':a.c===j?'x':'')+'"><b>'+'ABCDE'[j]+'.</b> '+mx(o)+(q.alasan&&q.alasan[j]&&j!==q.kunci?'<span class="why">'+mx(q.alasan[j])+'</span>':'')+'</li>').join('')+'</ul>':q.tipe==='pq'?'<p>P: '+txt(q.p)+'<br>Q: '+txt(q.q)+'</p>':q.tipe==='cukup'?'<p>'+ckLab(q)[0]+' '+txt(q.pern[0])+'<br>'+ckLab(q)[1]+' '+txt(q.pern[1])+'</p>':q.tipe==='bs'?'<ul class="ol">'+q.bs.map(b=>'<li>'+mx(b.teks)+' <b>('+(b.benar?'Benar':'Salah')+')</b></li>').join('')+'</ul>':'<p class="sm">Jawabanmu: '+esc(a.is||'kosong')+'</p>')+
    pembahasan(q,a)+(a.ok&&['harian','sim'].includes(it.set.mode)?'<div class="btns"><button class="btn sm" data-action="varianB" data-v="'+esc(q.qid)+'">Uji di 3 bentuk lain</button></div>':'')+'</details>'; }).join('');
  if(R.mode==='eb'){ const rs=Object.values(R.eb||{}), up=rs.filter(r=>r.ok&&!r.lulus).length, lu=rs.filter(r=>r.lulus).length, dn=rs.filter(r=>!r.ok).length;
    h=h.replace('<div class="fhead">','<div class="card has-lbl"><span class="lbl bl">Error Book</span><div class="ebsum c3">'+[['Naik kotak',up,'blue'],['Lulus',lu,'green'],['Mulai lagi',dn,'red']].map(x=>'<div style="--c:var(--'+x[2]+')"><b>'+x[1]+'</b><span class="sm">'+x[0]+'</span></div>').join('')+'</div>'+(dn?'<p class="sm ebnote">'+dn+' soal salah lagi. Perbarui diagnosisnya selagi masih ingat apa yang membuatmu keliru.</p>':'')+'</div><div class="fhead">'); }
  const nb=Object.keys(R.ebNew||{}).length+(R.mode==='eb'?Object.values(R.eb||{}).filter(r=>!r.ok).length:0);
  if(nb&&R.mode!=='eb') h=h.replace('<div class="fhead">','<div class="card ebnew has-lbl"><span class="lbl">Error Book</span><b class="ebnt">'+nb+' soal masuk Error Book</b><p class="sm">Diagnosis sekarang selagi kamu masih ingat jalan pikirmu tadi: pilih penyebab dan tulis satu aturan. Soalnya diulang mulai besok.</p><a class="btn pri block" href="#salah">Diagnosis sekarang</a></div><div class="fhead">');
  h+='<div class="btns foot"><a class="btn pri grow" href="#beranda">Selesai</a>'+(nb?'<a class="btn" href="#salah">Buka Error Book</a>':'')+'</div>';
  return h;
}
function hearts(n){ return [0,1,2].map(i=>'<i class="hrt'+(i<n?'':' off')+'">♥</i>').join(''); }
function gameHud(K){ return '<div class="hud"><span class="lives" aria-label="Nyawa '+K.lives+'">'+hearts(K.lives)+'</span><span class="combo'+(K.combo>=3?' on':'')+'">'+(K.combo>=3?'Kombo ×'+comboMul(K.combo):K.combo?'Beruntun '+K.combo:'Kombo')+'</span><span class="pts">'+K.score+' poin</span></div>'; }
function gameEnd(K,ok){ const st=K.stars||1, b=S.gbest[K.game]||{skor:0};
  return '<div class="card gend">'+(K.over&&K.res.length<K.items.length?'<p class="sm">Nyawa habis di soal '+K.res.length+'.</p>':'')+'<div class="stars">'+[1,2,3].map(i=>'<i class="'+(i<=st?'on':'')+'">★</i>').join('')+'</div><b class="big">'+K.score+'</b><span class="sm">poin · kombo terpanjang '+K.maxc+'</span>'+(K.rekor?'<span class="rekor">Rekor baru!</span>':'<span class="sm">Rekor: '+b.skor+' poin</span>')+'</div>'; }
function klLbl(K){ const g=K.game&&GMAP[K.game]; return '<span class="lbl'+(g&&!g.yk?' w':'')+'" style="--lc:'+(g?g.c:'var(--yellow)')+'">'+esc(K.title)+'</span>'; }
const CHEVI='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
function stepsFold(L,n){ if(!L||!L.length) return ''; const a=L.slice(0,n), b=L.slice(n); return '<ol class="steps">'+a.map(x=>'<li>'+mx(x)+'</li>').join('')+'</ol>'+(b.length?'<details class="more"><summary>Langkah lengkap '+CHEVI+'</summary><ol class="steps" start="'+(n+1)+'">'+b.map(x=>'<li>'+mx(x)+'</li>').join('')+'</ol></details>':''); }
function klKey(it){ if(it.kisi) return 'contoh susunan yang benar di kisi berikut (susunan lain juga diterima)'; return it.opsi?LTR[it.kunci]+'. '+it.opsi[it.kunci]:fmt(it.kunci); }
function viewKilat(){
  if(V.kl&&V.kl.intro) return viewIntro(V.kl);
  const K=V.kl, tgt=K.limit||20, back=K.game?'#game':'#beranda';
  if(K.baca) return '<header class="top run"><button class="btn sm" data-action="klstop">‹ Selesai</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" id="kt">'+PMK_DTK+' dtk</span></header>'+
    '<div class="card kl wide"><p class="sm">Baca dan pahami stimulus ini dalam '+PMK_DTK+' detik ('+esc(K.pmk.kode)+'). Setelah itu muncul 3 pertanyaan singkat, '+PMK_DTK+' detik per pertanyaan; stimulus tetap terlihat.</p>'+K.pmk.stim+'<button class="btn pri block" data-action="pmkmulai" id="pbtn">Sudah paham, mulai pertanyaan</button></div>';
  if(K.done){ const ok=K.res.filter(r=>r.ok).length, n=K.res.length, avg=n?K.res.reduce((s,r)=>s+r.ms,0)/n/1000:0;
    return '<header class="top run still"><button class="btn sm" data-action="klclose">‹ Kembali</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" style="visibility:hidden">0</span></header>'+(K.game?gameEnd(K,ok):'')+'<div class="card score"><div><b class="big">'+ok+'/'+n+'</b><span class="sm">benar</span></div><div><b class="big">'+avg.toFixed(1).replace('.',',')+'</b><span class="sm">detik per soal · target '+tgt+'</span></div></div>'+
    (K.res.some(r=>!r.ok)?'<div class="fhead"><h2>Pembahasan yang salah</h2><button class="btn sm" data-action="foldall">Buka/tutup semua</button></div>'+K.res.map((r,ix)=>[r,ix]).filter(x=>!x[0].ok).map(([r,ix])=>'<details class="card fold"><summary><span class="num">'+(ix+1)+'</span><span class="grow snip1">'+esc(r.it.perintah.slice(0,64))+'</span>'+CHEVI+'</summary>'+(r.it.kisi?kisiSolved(r.it):r.it.html||'<p class="ask">'+mx(r.it.perintah)+'</p>')+'<p class="kunci">Kunci: '+mx(klKey(r.it))+'</p>'+stepsFold(r.it.langkah,3)+'</details>').join(''):'')+
    '<div class="btns foot"><button class="btn pri grow" data-action="klclose">Selesai</button><button class="btn" data-action="'+(K.game?'game':K.pmk?'pmkilat':'kilat')+'" data-v="'+(K.game||'')+'">'+(K.pmk?'Stimulus lain':'Main lagi')+'</button></div>'; }
  const it=K.items[K.i], n=K.items.length, rv=!!K.fb;
  let h='<header class="top run"><button class="btn sm" data-action="klstop">‹ Selesai</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" id="kt">'+(K.limit?K.limit+' dtk':'0 dtk')+'</span></header>'+(K.game?gameHud(K):'')+bar(pct(K.i,n));
  const gv=K.game&&GV[K.game];
  if(gv) h+='<div class="gstage">';
  h+='<div class="card kl'+(it.html||gv?' wide':'')+(K.game?' gm g-'+K.game:'')+(K.fb?(K.fb.ok?' good':' wrong'):'')+'">'+(gv?gv(it,K,rv):it.html?'<div class="klh">'+it.html+'</div>':'<p class="klq'+(it.opsi?' sm2':'')+'">'+mx(it.perintah)+'</p>');
  if(it.opsi&&!gv){ h+='<div class="klo">'+it.opsi.map((o,i)=>{ let c='opt'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+LTR[i]+'</span><span class="grow">'+mx(o)+'</span></button>'; }).join('')+'</div>'; }
  if(K.fb) h+=(K.game&&K.fb.ok?'<span class="gain">+'+K.fb.pts+(K.fb.mul>1?' · kombo ×'+K.fb.mul:'')+(K.fb.bonus?' · bonus koin +'+K.fb.bonus:'')+'</span>':K.game?'<span class="gain lose">−1 nyawa</span>':'')+'<p class="kunci">'+(K.fb.ok?'Benar':(K.fb.timeout?'Waktu habis. ':'')+'Kunci: '+mx(klKey(it)))+'</p>'+(!K.fb.ok&&it.kisi?kisiSolved(it):'')+(K.fb.ok?'':stepsFold(it.langkah,2))+'<button class="btn pri block" data-action="klnext" id="pbtn">'+(K.over?'Lihat hasil':'Lanjut')+'</button>';
  else if(gv&&it.kp) h+=keypad(K,it);
  else if(!it.opsi&&!gv) h+='<div class="isi"><input id="klans" inputmode="decimal" autocomplete="off" placeholder="jawaban" value="'+esc(K.ans)+'"><button class="btn" data-action="klneg" aria-label="Ganti tanda">±</button></div><button class="btn pri block" data-action="klcheck" id="pbtn"'+(isNaN(parseNum(K.ans))?' disabled':'')+'>Periksa</button>';
  return h+'</div>'+(gv?'</div>':'');
}

function render(){
  wkApply();
  let r=route(), h, full=false;
  if(r==='main'){ if(V.run){ h=viewRun(); full=true; } else if(V.kl){ h=viewKilat(); full=true; } else if(V.hasil){ h=viewHasil(); full=true; } else { r='beranda'; } }
  if(!h) h=r==='game'?viewGame():r==='soal'?viewSoal():r==='salah'?viewSalah():r==='progres'?viewProgres():r==='pengaturan'?viewPengaturan():r==='mingguan'?viewMingguan():viewBeranda();
  $('#view').innerHTML=(full?'':appbar()+(hero(r)||'<div class="gap0"></div>'))+h; $('#nav').hidden=full;
  document.body.classList.remove('cbt'); /* semua halaman memakai tema lego */
  document.querySelectorAll('#view .card').forEach(c=>{ if(c.tagName!=='DETAILS') c.insertAdjacentHTML('afterbegin',STUDS); });
  const LC=['','g','bl','o']; let li=0;
  document.querySelectorAll('#view > h2').forEach(t=>{ const n=t.nextElementSibling; if(!n||n.tagName!=='DIV'||!n.classList.contains('card')||n.classList.contains('score')) return;
    const l=document.createElement('span'); l.className='lbl '+LC[li++%4]; l.innerHTML=t.innerHTML; n.insertBefore(l,n.querySelector(':scope > :not(.st)')); n.classList.add('has-lbl'); t.remove(); });
  const ns=ebBadge();
  $('#nav').innerHTML=NAV.map(x=>'<a href="#'+x[0]+'" class="'+(r===x[0]?'on ':'')+(x[0]==='beranda'?'yk':'')+'" style="--c:'+x[2]+'">'+svgI(x[3])+'<span>'+x[1]+'</span>'+(x[0]==='salah'&&ns?'<i>'+ns+'</i>':'')+'</a>').join('');
  const f=$('#klans')||(V.run&&!V.run.A[V.run.cur].done?$('#isian'):null); if(f&&!('ontouchstart' in window)) f.focus();
}

/* ---------- Aksi ---------- */
function act(a,v){
  const R=V.run, K=V.kl, Z=V.soal;
  if(a!=='reset') V.prog.reset=false;
  if(a==='kilat') startKilat();
  else if(a==='pmkilat') startPmKilat();
  else if(a==='pmkmulai') pmkMulai();
  else if(a==='wkcopy') copyText(wkPrompt(v),'Prompt mingguan disalin. Jalankan di Claude, lalu tempel JSON-nya di sini.');
  else if(a==='wksave') wkSave();
  else if(a==='wkdel'){ if(S.wk){ delete S.wk[v]; save(); WK_ON=''; V.wkres=null; render(); } }
  else if(a==='gosoal'){ Z.tab='harian'; Z.tgl=ymd(new Date()); Z.res=null; go('soal'); }
  else if(a==='gosim'){ Z.tab=v; Z.res=null; go('soal'); }
  else if(a==='mulai'){ const ss=loadSesi(); if(ss&&ss.sid===v){ V.run=ss; V.hasil=null; go('main'); return; } const st=S.sets.find(x=>x.id===v); if(st) startSet(st); }
  else if(a==='resume'){ const o=loadSesi(); if(o){ V.run=o; V.hasil=null; go('main'); } }
  else if(a==='ulang'||a==='ebulang') ebStartUlang();
  else if(a==='goeb') go('salah');
  else if(a==='ebsebab'){ const [q,sb]=v.split('|'); V.eb.sel[q]=sb; delete V.eb.err[q]; render(); }
  else if(a==='ebsimpan') ebDiag(v);
  else if(a==='ebedit'){ V.eb.edit=v; render(); const el=document.getElementById('eb-'+v); if(el) el.scrollIntoView({block:'start'}); }
  else if(a==='ebbatal'){ V.eb.edit=null; delete V.eb.sel[v]; delete V.eb.txt[v]; delete V.eb.err[v]; render(); }
  else if(a==='ebhapus'){ if(V.eb.del===v){ delete S.eb[v]; tandaHapus('eb',v); V.eb.del=null; save(); render(); toast('Dihapus dari Error Book.'); } else { V.eb.del=v; toast('Tekan sekali lagi untuk menghapus.'); } }
  else if(a==='ebf'){ V.eb.f=v; render(); }
  else if(a==='ebmore'){ V.eb.n+=5; render(); }
  else if(a==='ebprompt') copyText(ebPrompt(),'Prompt analisis disalin. Jalankan di Claude.');
  else if(a==='ulang1'){ const it=findQ(v); if(it) startUlang([it]); }
  else if(a==='varian'||a==='varianB'){ const it=findQ(v); if(it) copyText(promptVarian(it.q,it.set,a==='varianB'),'Prompt varian disalin. Tempel hasilnya di Set soal.'); }
  else if(a==='ebkembar'){ const L=ebButuh(); if(L.length) copyText(ebPromptUlang(L),'Prompt soal pengganti disalin. Jalankan di Claude, lalu tempel hasilnya di Set soal.'); }
  else if(a==='tab'){ Z.tab=v; Z.res=null; render(); }
  else if(a==='tgl'){ Z.tgl=v; render(); }
  else if(a==='copy'){ copyText($('#promptbox').value,'Prompt disalin. Jalankan di Claude.'); }
  else if(a==='acak'){ if(Z.tab==='harian') buildResep(Z.tgl,fromYmd(Z.tgl),PLAN.harian,'harian'); else resepSim(Z.tab,true); render(); toast('Resep diacak ulang.'); }
  else if(a==='simpan'){ Z.paste=$('#paste').value; const all=parseMany(Z.paste), good=all.filter(x=>!x.err.length), bad=all.filter(x=>x.err.length);
    good.forEach(x=>addSet(x.set));
    const err=bad.length?(all.length>1?bad.flatMap(x=>{ const i=all.indexOf(x)+1; return x.err.map(e=>'Blok '+i+': '+e); }):bad[0].err):[];
    const warn=good.flatMap(x=>(good.length>1?x.warn.map(w=>x.set.label+': '+w):x.warn));
    if(good.length){ if(!bad.length) Z.paste=''; Z.res={ok:good.map(x=>x.set.label+' ('+x.set.soal.length+' soal)').join(', ')+' tersimpan.',warn,err}; }
    else Z.res={err,warn:[]};
    render(); }
  else if(a==='prompt2'){ copyText(promptStok(Z.tgl),'Prompt 2 hari disalin. Jalankan di Claude, lalu tempel kedua blok json sekaligus.'); }
  else if(a==='riwayat'){ if(unduh('riwayat-bentuk-'+ymd(new Date())+'.json',riwayatJson())) toast('Riwayat bentuk diunduh. Unggah ke pengetahuan proyek Claude.'); else copyText(riwayatJson(),'Riwayat bentuk disalin.'); }
  else if(a==='riwayatSalin'){ copyText(riwayatJson(),'Riwayat bentuk (JSON) disalin.'); }
  else if(a==='hapus'){ if(V._del===v){ S.sets=S.sets.filter(x=>x.id!==v); tandaHapus('sets',v); V._del=null; save(); render(); } else { V._del=v; toast('Tekan × sekali lagi untuk menghapus set ini.'); } }
  else if(a==='suara'){ SFX.setSuara(!SFX.on()); render(); SFX.play('benar'); }
  else if(a==='musik'){ SFX.setMusik(!SFX.musikOn()); render(); }
  else if(a==='cek'){ S.cek=S.cek==='langsung'?'akhir':'langsung'; save(); render(); }
  else if(a==='terang'){ S.tema=cfgK().terang?'gelap':'terang'; applyTema(); save(); render(); }
  else if(a==='gerak'){ S.gerak=!cfgK().gerak; applyTema(); save(); render(); }
  else if(a==='hari'){ V.prog.hari=true; render(); }
  else if(a==='hariNo'){ V.prog.hari=false; render(); }
  else if(a==='hariYes'){ V.prog.hari=false; hapusHariIni(); render(); toast('Progres hari ini dihapus.'); }
  else if(a==='cfg'){ go('pengaturan'); }
  else if(a==='kembali'){ if(history.length>1) history.back(); else go('beranda'); }
  else if(a==='tema'){ S.tema=S.tema==='terang'?'gelap':S.tema==='gelap'?'auto':'terang'; applyTema(); save(); render(); }
  else if(a==='ulas'){ S.ulas=S.ulas===false; save(); render(); }
  else if(a==='semua'){ S.semua=!S.semua; save(); render(); }
  else if(a==='ekspor'){ syncDisk(); copyText(JSON.stringify(S),'Data disalin.'); }
  else if(a==='cobasimpan'){ const R2=V.hasil; if(R2){ save(); R2.simpan=cekTersimpan(R2); if(R2.simpan.ok){ clearSesi(); toast('Tersimpan.'); } render(); } }
  else if(a==='diag'){ V.diag=!V.diag; render(); }
  else if(a==='diagsalin'){ copyText(diagText(),'Hasil diagnosis disalin. Tempel dan kirim ke chat Claude.'); }
  else if(a==='pulih'){ V.pulih=V.pulih&&V.pulih.buka?null:{buka:true,txt:''}; render(); }
  else if(a==='pulihcek'){ const el=$('#pulihtxt'); if(el) V.pulih.txt=el.value; pulihCek(); render(); }
  else if(a==='pulihya'){ pulihYa(); render(); }
  else if(a==='reset'){ if(V.prog.reset){ S=Object.assign(fresh(),{tema:S.tema,gerak:S.gerak}); tandaHapus('reset'); S.saved=S.tomb.reset; V.prog.reset=false; applyTema(); clearSesi(); save(); toast('Semua data dihapus.'); } else V.prog.reset=true; render(); }
  else if(R&&a==='pick'){ if(R.A[R.cur].done) return; R.A[R.cur].c=+v; persist(); render(); }
  else if(R&&a==='bs'){ if(R.A[R.cur].done) return; const [i,b]=v.split(':'); R.A[R.cur].bs[+i]=b==='1'; persist(); render(); }
  else if(R&&a==='periksa'){ tick(R); recordAt(R.cur); save(); persist(); render(); }
  else if(R&&(a==='next'||a==='prev'||a==='ke')){ tick(R); const n=R.items.length; let to=a==='ke'?+v:a==='prev'?R.cur-1:R.cur+1; if(a==='next'&&to>=n){ to=R.A.findIndex(x=>!x.done); if(to<0) to=n-1; } R.cur=Math.max(0,Math.min(n-1,to)); R.t0=Date.now(); persist(); render(); window.scrollTo(0,0); }
  else if(R&&a==='selesai'){ finishRun(); }
  else if(R&&a==='keluar'){ tick(R); persist(); V.run=null; go('beranda'); toast('Sesi disimpan. Lanjutkan dari Beranda.'); }
  else if(K&&a==='klcheck') kilatCheck();
  else if(K&&a==='klpick') kilatCheck(v);
  else if(K&&a==='kp') kpPress(v);
  else if(K&&a==='gx'){ if(K.fb) return; const f=GX[K.game]; if(f) f(K.items[K.i],K,v); if(!K.fb) render(); }
  else if(a==='game') startGame(v);
  else if(K&&a==='gstart') beginGame(v);
  else if(K&&a==='klnext') kilatNext();
  else if(K&&a==='klneg'){ const i=$('#klans'); K.ans=i.value.trim().startsWith('-')||i.value.trim().startsWith('−')?i.value.trim().slice(1):'−'+i.value.trim(); render(); }
  else if(K&&a==='klstop'){ if(K.intro){ V.kl=null; go('game'); } else if(K.res.length){ if(K.game&&!K.done) finishGame(K); K.done=true; render(); } else { const g=K.game; V.kl=null; go(g?'game':'beranda'); } }
  else if(a==='foldall'){ const ds=[...document.querySelectorAll('details.fold')], open=ds.some(d=>!d.open); ds.forEach(d=>d.open=open); }

<script>

    b.style.opacity = 1; b.style.transform = 'translate(-50%,0)'; b.lastChild.textContent = 'Memuat ulang…';
    var pre = window.PTR_BEFORE_RELOAD, go = function(){ location.reload(); };
    try { if (pre) { Promise.race([Promise.resolve(pre()), new Promise(function(r){ setTimeout(r, 4000); })]).then(go, go); return; } } catch (e) {}
    setTimeout(go, 150);
  }
})();
</script>

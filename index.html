  localStorage.setItem(SKEY,JSON.stringify({day:ymd(new Date()),sid:R.sid,label:R.label,mode:R.mode,qids:R.items.map(it=>it.q.qid),A:R.A,T:R.T,cur:R.cur,cek:R.cek,limit:R.limit,started:R.started,rep:R.rep})); }catch(e){} }
function clearSesi(){ try{ localStorage.removeItem(SKEY); }catch(e){} }
function loadSesi(){ try{ const o=JSON.parse(localStorage.getItem(SKEY)||'null'); if(!o||o.day!==ymd(new Date())) return null; const items=o.qids.map(findQ); if(items.some(x=>!x)) return null;
  if(o.limit&&o.started+o.limit<Date.now()) return null; return Object.assign(o,{items,t0:Date.now()}); }catch(e){ return null; } }

/* ---------- Hitung cepat ---------- */
function kilatGens(){ const pool=eqUnits(); const ok=g=>pool.has(g.unit)||(V13[g.unit]?V13[g.unit][0]:[]).some(p=>pool.has(p)); let gs=GENS.filter(ok); if(!gs.length) gs=GENS.filter(g=>g.unit==='MD-02'); return gs; }
function kilatSet(n){ const pool=poolUnits(); let gs=kilatGens(); gs=RN.shuf(gs); const out=[]; let i=0, guard=0;
  while(out.length<n&&guard++<n*40){ const g=gs[i++%gs.length]; let it=null; try{ it=g.fn({open:pool}); }catch(e){} if(it&&isFinite(it.kunci)) out.push(Object.assign(it,{key:g.key})); } return out; }
function startKilat(){ V.kl={title:'Hitung cepat',game:null,limit:null,items:kilatMix(),i:0,ans:'',fb:null,res:[],t0:Date.now(),done:false}; go('main'); }
function kilatCheck(pick,timeout){ const K=V.kl; if(!K||K.fb) return; const it=K.items[K.i], ms=Date.now()-K.t0; let ok;
  if(timeout) ok=false; else if(it.check){ ok=!!it.check(K); } else if(it.opsi){ if(pick==null) return; K.pick=+pick; ok=K.pick===it.kunci; } else { const v=parseNum(K.ans); if(isNaN(v)) return; ok=Math.abs(v-it.kunci)<1e-9; if(it.needSel!=null&&K.st.sel!==it.needSel) ok=false; }
  K.fb={ok,ms,timeout:!!timeout}; K.res.push({it,ok,ms});
  if(K.game){ (S.game[K.game]=S.game[K.game]||[]).push({ok,ms,ts:Date.now()});
    if(ok){ K.combo++; K.maxc=Math.max(K.maxc,K.combo); const mul=comboMul(K.combo); K.fb.bonus=it.bonus?it.bonus(K):0; K.fb.pts=10*mul+K.fb.bonus; K.fb.mul=mul; K.score+=K.fb.pts; }
    else { K.combo=0; K.lives--; if(K.lives<=0) K.over=true; } }
  else S.kil.push({k:it.key,ok,ms,ts:Date.now()});
  save(); render();
  if(ok&&!K.over){ clearTimeout(K._t); K._t=setTimeout(()=>{ if(V.kl===K&&K.fb) kilatNext(); },K.game==='mesin'?1600:K.game?1100:700); } }
function comboMul(c){ return c>=6?3:c>=3?2:1; }
function gameStars(K){ const ok=K.res.filter(r=>r.ok).length; return K.over&&K.res.length<K.items.length?1:ok>=9?3:ok>=7?2:1; }
function finishGame(K){ const st=gameStars(K), b=S.gbest[K.game]||{skor:0,bintang:0}; K.stars=st; K.rekor=K.score>b.skor; S.gbest[K.game]={skor:Math.max(b.skor,K.score),bintang:Math.max(b.bintang,st),main:(b.main||0)+1}; save(); }
function kilatNext(){ const K=V.kl; if(!K) return; clearTimeout(K._t); if(K.i>=K.items.length-1||K.over){ if(K.game&&!K.done) finishGame(K); K.done=true; render(); window.scrollTo(0,0); return; } K.i++; K.ans=''; K.pick=null; K.st={}; K.fb=null; K.t0=Date.now(); render(); }

/* ================== Latihan cepat: Hitung Cepat (maju, balik, estimasi) dan mini game ==================
   Semua soal di sini dibangkitkan aplikasi sendiri (tanpa Claude) dan hanya memakai materi yang sudah terbuka.
   Bentuk item: {perintah, html?, opsi?, kunci (angka, atau indeks opsi bila ada opsi), langkah[]} */

const has=(...u)=>{ const p=eqUnits(); return u.some(x=>p.has(x)); };
const LTR='ABCDE';
function niceStep(v){ const a=Math.abs(v); const e=Math.pow(10,Math.floor(Math.log10(a||1))); const m=a/e; return (m<2?.1:m<5?.2:.5)*e*2; }
function rnd(x){ return Math.round(x*1e6)/1e6; }

/* ---------- Estimasi "paling mendekati" ---------- */
function estimItem(i,vid){
  /* tiap templat mengembalikan e (soal), v (nilai sebenarnya), est (hasil pembulatan), s (langkah); step opsional */
  const r10=x=>Math.round(x/10)*10, G={kali:[],tiga:[],desimal:[],balik:[],akar:[]};
  G.kali.push(()=>{ const a=RN.int(2,9)*10+RN.pick([-2,-1,1,2]), b=RN.int(2,9)*10+RN.pick([-2,-1,1,2]), A=r10(a), B=r10(b); return {e:a+' × '+b,v:a*b,est:A*B,s:['Bulatkan: '+a+' ≈ '+A+', '+b+' ≈ '+B,A+' × '+B+' = '+fmt(A*B)]}; });
  G.kali.push(()=>{ const d=RN.int(2,9)*10+RN.pick([-1,1]), D=r10(d), q=RN.int(3,30), n=q*D+RN.int(-4,4); return {e:fmt(n)+' ÷ '+d,v:n/d,est:n/D,s:['Bulatkan pembagi: '+d+' ≈ '+D,fmt(n)+' ÷ '+D+' ≈ '+fmt(Math.round(n/D*10)/10)]}; });
  G.tiga.push(()=>{ const a=RN.int(2,6)*10+RN.pick([-1,1]), b=RN.int(2,5)*10+RN.pick([-1,1]), c=RN.int(1,9)*100+RN.pick([-3,-2,2,3]), A=r10(a), B=r10(b), C=Math.round(c/100)*100;
    return {e:a+' × '+b+' + '+fmt(c),v:a*b+c,est:A*B+C,s:['Bulatkan: '+a+' ≈ '+A+', '+b+' ≈ '+B+', '+fmt(c)+' ≈ '+fmt(C),A+' × '+B+' + '+fmt(C)+' = '+fmt(A*B+C)]}; });
  G.tiga.push(()=>{ const a=RN.int(3,9)*100+RN.pick([-3,-2,2,3]), b=RN.int(2,5)*10+RN.pick([-1,1]), c=RN.int(2,5)*10+RN.pick([-1,1]), A=Math.round(a/100)*100, B=r10(b), C=r10(c);
    return {e:fmt(a)+' + '+b+' × '+c,v:a+b*c,est:A+B*C,s:['Kali dulu: '+b+' × '+c+' ≈ '+B+' × '+C+' = '+fmt(B*C),fmt(A)+' + '+fmt(B*C)+' = '+fmt(A+B*C)]}; });
  G.desimal.push(()=>{ const a0=RN.pick([.25,.5,.75]), a=Math.round((a0+RN.pick([-.02,-.01,.01,.02]))*100)/100, b0=RN.int(4,30)*4, b=Math.round((b0+RN.pick([-.3,-.2,.2,.3]))*10)/10; return {e:fmt(a)+' × '+fmt(b),v:a*b,est:a0*b0,s:['Bulatkan: '+fmt(a)+' ≈ '+fmt(a0)+', '+fmt(b)+' ≈ '+b0,fmt(a0)+' × '+b0+' = '+fmt(a0*b0)]}; });
  G.desimal.push(()=>{ const p0=RN.pick([10,20,25,50]), p=p0+RN.pick([-.6,-.4,.4,.6]), N0=RN.int(2,9)*100, N=N0+RN.pick([-3,-2,2,3]); return {e:fmt(p)+'% dari '+fmt(N),v:p*N/100,est:p0*N0/100,s:['Bulatkan: '+fmt(p)+'% ≈ '+p0+'%, '+fmt(N)+' ≈ '+fmt(N0),p0+'% × '+fmt(N0)+' = '+fmt(p0*N0/100)]}; });
  G.desimal.push(()=>{ const [a,b]=RN.pick([[1,3],[2,3],[1,6],[5,6],[1,7],[3,7]]), M=RN.int(10,60)*b, N=M+RN.pick([1,2,-1,-2]); return {e:a+'/'+b+' dari '+fmt(N),v:a*N/b,est:a*M/b,s:['Bulatkan '+fmt(N)+' ke kelipatan '+b+' terdekat: '+fmt(M),fmt(M)+' ÷ '+b+' × '+a+' = '+fmt(a*M/b)]}; });
  G.balik.push(()=>{ const d=RN.int(2,6)*10+RN.pick([-1,1]), q=RN.int(11,25), N=q*d+RN.int(-3,3); return {e:'□ × '+d+' ≈ '+fmt(N),np:1,v:N/d,est:q,step:1,s:['Coba □ = '+q+': '+q+' × '+d+' = '+fmt(q*d),'Paling dekat ke '+fmt(N)+', jadi □ ≈ '+q]}; });
  G.akar.push(()=>{ let n; do{ n=RN.int(20,150); }while(Number.isInteger(Math.sqrt(n))); const v=Math.sqrt(n), k=Math.round(v); return {e:'√'+n,v,est:k,step:1,s:[(k-1)+'² = '+(k-1)*(k-1)+', '+k+'² = '+k*k+', '+(k+1)+'² = '+(k+1)*(k+1),fmt(n)+' paling dekat ke '+k*k+', jadi √'+n+' ≈ '+k]}; });
  const T=G[vid]&&G[vid].length?G[vid]:(has('BIL-13','BIL-14')?G.kali.concat(G.desimal):G.kali);
  for(let t=0;t<60;t++){ const it=RN.pick(T)(); const step=it.step||niceStep(it.v)/2, T0=Math.round(it.v/step)*step;
    if(Math.abs(it.v-T0)>step*.3||T0<=0||Math.abs(it.est-T0)>step*.45) continue;
    const k=RN.int(0,4), opsi=[]; for(let i=0;i<5;i++) opsi.push(rnd(T0+(i-k)*step)); if(opsi[0]<=0) continue;
    return {perintah:'Paling mendekati: '+it.e,est:{e:it.e,v:it.v,o:opsi,np:it.np},opsi:opsi.map(fmt),kunci:k,langkah:it.s.concat(['Nilai sebenarnya '+fmt(Math.round(it.v*100)/100)+', paling dekat dengan '+fmt(T0)])}; }
  return null;
}

/* ---------- Hitung Cepat: soal balik arah ---------- */
function balikItem(){

/* Hitung Cepat: 8 hitungan maju + 3 bentuk yang diputar harian (4 soal per bentuk) */

    if(!ok){ const del=Math.abs(d)>=20?Math.max(1,Math.round(Math.abs(d)*RN.pick([.1,.2]))):Number.isInteger(d)?RN.int(1,3):.5; v=Math.round((d+RN.pick([-1,1])*del)*100)/100; if(v===d) return null; }

    return {perintah:q+'?',opsi:['Benar','Salah'],kunci:ok?0:1,langkah:x.langkah.concat([ok?'Jadi benar.':'Seharusnya '+fmt(d)+', bukan '+fmt(v)+'.'])}; },
  banding:()=>{ const no=['k-pec-persen','k-pec-op','k-satuan','k-suku','k-untung'], gs=kilatGens().filter(g=>!no.includes(g.key)); if(!gs.length) return null;
    const g=RN.pick(gs), x=g.fn(), y=g.fn(); if(!x||!y||x.perintah===y.perintah) return null; const k=x.kunci>y.kunci?0:x.kunci<y.kunci?1:2;

function kilatMix(){
  const maju=kilatSet(8).map(it=>Object.assign(it,{jenis:'maju'})), ext=[];
  (gameBentuk('kilat',3)||[]).forEach(v=>{ let n=0, g=0; while(n<4&&g++<40){ let it=null; try{ it=KX[v.id](); }catch(e){} if(it){ ext.push(Object.assign(it,{key:v.id,jenis:v.id})); n++; } } });

/* ---------- Game 1: Timbangan P–Q ---------- */
function exprOf(v){ /* ekspresi bilangan bulat bernilai v */
  for(let t=0;t<20;t++){ const k=RN.int(0,2);
    if(k===0){ const a=RN.int(2,9), b=Math.floor(v/a), c=v-a*b; if(b>=2) return {s:a+' × '+b+(c>0?' + '+c:c<0?' − '+(-c):''),st:a+' × '+b+(c?(c>0?' + ':' − ')+Math.abs(c):'')+' = '+v}; }
    if(k===1){ const c=RN.int(2,9), a=RN.int(2,9), b=Math.round((v+c)/a); if(b>=2&&a*b-c===v) return {s:a+' × '+b+' − '+c,st:a*b+' − '+c+' = '+v}; }
    if(k===2){ const d=RN.int(2,6); return {s:fmt(v*d)+' ÷ '+d,st:fmt(v*d)+' ÷ '+d+' = '+v}; } }
  return {s:String(v),st:String(v)};
}
function zone5(p,q){ return p>=2*q-1e-9?0:p>q+1e-9?1:Math.abs(p-q)<1e-9?2:3; }
function pqJudge(samples){ /* samples: [{p,q,lab}] */
  const pos=samples.every(x=>x.q>0); if(!pos) return null; const z=samples.map(x=>zone5(x.p,x.q)), same=z.every(v=>v===z[0]);
  return pos?{versi:5,kunci:same?z[0]:4}:null; /* Q harus selalu positif */
}
function pqItem(){

    const P=exprOf(p), Q=exprOf(q); return {info:'Perhatikan dua kuantitas berikut.',P:P.s,Q:Q.s,smp:[{p,q}],st:['P = '+P.st,'Q = '+Q.st]}; });

  T.push(()=>{ const a=RN.int(2,4), c=RN.int(1,6); const xs=[-1,-2,-3,-5,-8];
    const f=RN.pick([['−'+a+'x','−x + '+c,x=>-a*x,x=>c-x],['x − '+c,c+' − x',x=>x-c,x=>c-x],['x + '+(c+6),'−x',x=>x+c+6,x=>-x]]);
    return {info:'x bilangan bulat negatif.',P:f[0],Q:f[1],smp:xs.map(x=>({p:f[2](x),q:f[3](x),lab:'x = '+x})),st:null,edge:'Uji beberapa nilai negatif, termasuk yang dekat dan jauh dari nol.'}; });
  if(has('BIL-13')){
    T.push(()=>{ const [a,b]=RN.pick([[1,2],[2,3],[3,4],[2,5],[3,5]]), [c,d]=RN.pick([[1,3],[1,4],[3,8],[1,5],[4,5]]); const N=b*d*RN.int(2,8), M=b*d*RN.int(2,8); const p=a*N/b, q=c*M/d;
      return {info:'Perhatikan dua kuantitas berikut.',P:a+'/'+b+' dari '+N,Q:c+'/'+d+' dari '+M,smp:[{p,q}],st:['P = '+a+'/'+b+' × '+N+' = '+fmt(p),'Q = '+c+'/'+d+' × '+M+' = '+fmt(q)]}; });
    T.push(()=>{ const p1=RN.pick([10,20,25,40,50,75]), p2=RN.pick([10,20,25,40,50,75]), A=RN.int(2,20)*20, B=RN.int(2,20)*20; const p=p1*A/100, q=p2*B/100; if(q<=0) return null;
      return {info:'Perhatikan dua kuantitas berikut.',P:p1+'% dari '+A,Q:p2+'% dari '+B,smp:[{p,q}],st:['P = '+fmt(p),'Q = '+fmt(q)]}; });

    return {info:'x bilangan bulat dengan 1 ≤ x ≤ '+hi+'.',P:f[0],Q:f[1],smp:xs.map(x=>({p:f[2](x),q:f[3](x),lab:'x = '+x})),st:null}; });
  if(has('ALJ-01','BIL-14')) T.push(()=>{ const S=RN.int(8,16); const xs=[]; for(let x=Math.floor(S/2)+1;x<S;x++) xs.push(x);

  T.push(T[0]); /* soal angka murni dibobot dua kali supaya opsi "sama" dan "dua kali" juga sering muncul */

    const why=j.kunci===4?['Hubungannya berubah untuk nilai yang berbeda, jadi tidak dapat ditentukan.']:[];
    return {perintah:r.info+' P: '+r.P+'. Q: '+r.Q+'.',pqv:{info:r.info,P:r.P,Q:r.Q,smp:r.smp,versi:j.versi},html:'<p class="sm">'+esc(r.info)+'</p><div class="pq"><div><span class="sm">P</span>'+mx(r.P)+'</div><div><span class="sm">Q</span>'+mx(r.Q)+'</div></div>',opsi:L,kunci:j.kunci,langkah:st.concat(r.edge&&!r.st?[r.edge]:[],why)}; }

/* ---------- Timbangan P–Q: suku per sisi untuk dicoret ----------
   P dan Q berupa perkalian faktor positif. Faktor yang sama di kedua sisi boleh dicoret karena
   membagi kedua sisi dengan bilangan positif yang sama tidak mengubah perbandingan (termasuk P ≥ 2Q). */
function pqCoretItem(){
  const N=v=>({t:String(v),k:'n'+v,v});
  const pool=[2,3,4,5,6,7,8,9,11,12,13,15].map(N);
  const POW={9:'3²',8:'2³',25:'5²',16:'2⁴',27:'3³'}, pw=has('BIL-15');
  if(pw) [[9,'3²'],[8,'2³'],[25,'5²'],[16,'2⁴']].forEach(([v,t])=>pool.push({t,k:'n'+v,v}));
  const alt=tok=>pw&&POW[tok.v]&&tok.t!==POW[tok.v]&&RN.chance(.45)?{t:POW[tok.v],k:tok.k,v:tok.v}:tok.t!==String(tok.v)&&RN.chance(.45)?N(tok.v):tok;
  const T=[];
  T.push(()=>{ const zone=RN.int(0,3); let a,b;
    if(zone===0){ b=RN.int(2,6); a=2*b+RN.pick([0,0,1,2,3]); } else if(zone===1){ b=RN.int(3,9); a=RN.int(b+1,2*b-1); } else if(zone===2){ a=b=RN.int(2,9); } else { a=RN.int(2,8); b=RN.int(a+1,a+6); }
    const com=RN.shuf(pool.slice()).slice(0,RN.int(1,2)), P=com.map(x=>x).concat([N(a)]), Q=com.map(alt).concat([N(b)]);
    return {info:'Perhatikan dua kuantitas berikut.',P:RN.shuf(P),Q:RN.shuf(Q),smp:[{p:a*com.reduce((m,x)=>m*x.v,1),q:b*com.reduce((m,x)=>m*x.v,1)}]}; });
  if(has('ALJ-01','BIL-14')){
    const X={t:'x',k:'x',v:null};
    T.push(()=>{ const zone=RN.int(0,3); let a,b;
      if(zone===0){ b=RN.int(2,4); a=2*b+RN.pick([0,1,2]); } else if(zone===1){ b=RN.int(3,7); a=RN.int(b+1,2*b-1); } else if(zone===2){ a=b=RN.int(2,7); } else { a=RN.int(2,6); b=RN.int(a+1,a+5); }
      const c=RN.pick(pool), xs=[1,2,3,4,5];
      return {info:'x bilangan bulat positif.',P:RN.shuf([N(a),X,c]),Q:RN.shuf([N(b),X,alt(c)]),smp:xs.map(x=>({p:a*x*c.v,q:b*x*c.v,lab:'x = '+x}))}; });
    T.push(()=>{ const c=RN.pick(pool), k=RN.pick([1,2,3]), lo=RN.pick([1,1,3,4]), xs=[lo,lo+1,lo+2,lo+3];
      const Q=k>1?[N(k),alt(c)]:[alt(c)];
      return {info:'x bilangan bulat dengan x ≥ '+lo+'.',P:RN.shuf([X,c]),Q:RN.shuf(Q),smp:xs.map(x=>({p:x*c.v,q:k*c.v,lab:'x = '+x}))}; });
  }
  for(let t=0;t<30;t++){ const r=RN.pick(T)(), j=pqJudge(r.smp); if(!j) continue;
    /* pasangan yang bisa dicoret */
    const used=new Set(), pairs=[]; r.P.forEach((a,i)=>{ const jx=r.Q.findIndex((b,jj)=>!used.has(jj)&&b.k===a.k); if(jx>=0){ used.add(jx); pairs.push([i,jx]); } });
    const remP=r.P.filter((_,i)=>!pairs.some(p=>p[0]===i)), remQ=r.Q.filter((_,j)=>!pairs.some(p=>p[1]===j));
    const show=a=>a.length?a.map(x=>x.t).join(' × '):'1';
    const st=pairs.map(([i,jx])=>'Coret '+r.P[i].t+(r.P[i].t!==r.Q[jx].t?' dan '+r.Q[jx].t+' (nilainya sama, '+fmt(r.P[i].v)+')':'')+' di kedua sisi.');
    st.push('Sisa: P = '+show(remP)+', Q = '+show(remQ)+'.');
    if(r.smp.length>1) st.push(...r.smp.slice(0,3).map(x=>x.lab+': '+PQ5[zone5(x.p,x.q)].replace(/\.$/,'')));
    st.push(j.kunci===4?'Hubungannya berubah untuk nilai x yang berbeda, jadi tidak dapat ditentukan.':'Jadi: '+PQ5[j.kunci]);
    st.push('Mencoret faktor positif yang sama tidak mengubah perbandingan P dan Q, termasuk apakah P ≥ 2Q.');
    const Ps=show(r.P), Qs=show(r.Q);
    return {perintah:r.info+' P: '+Ps+'. Q: '+Qs+'.',coret:{P:r.P,Q:r.Q,n:pairs.length},pqv:{info:r.info,P:Ps,Q:Qs,smp:r.smp,versi:5},
      html:'<p class="sm">'+esc(r.info)+'</p><div class="pq"><div><span class="sm">P</span>'+mx(Ps)+'</div><div><span class="sm">Q</span>'+mx(Qs)+'</div></div>',opsi:PQ5,kunci:j.kunci,langkah:st}; }
}

/* ---------- Game 3: Kisi Operasi (cross math) ----------
   Kisi 3 × 3 dengan 12 slot operasi. Beberapa slot sudah terisi (seperti angka awal sudoku);
   pemain mengisi sisanya satu per satu sampai semua baris dan kolom benar. Dihitung dari kiri/atas. */
const OPS={'+':(a,b)=>a+b,'−':(a,b)=>a-b,'×':(a,b)=>a*b,'÷':(a,b)=>a/b};
function kisiInt(g,o){ for(let i=0;i<3;i++){ const r1=OPS[o['h'+i+'0']](g[i][0],g[i][1]), c1=OPS[o['v'+i+'0']](g[0][i],g[1][i]); if(!Number.isInteger(r1)||!Number.isInteger(c1)) return false; } const e=kisiEval(g,o); return e.r.concat(e.c).every(Number.isInteger); }
const KSLOTS=[]; for(let i=0;i<3;i++) for(let j=0;j<2;j++){ KSLOTS.push('h'+i+j); KSLOTS.push('v'+i+j); }
function kisiEval(g,o){ const r=[0,1,2].map(i=>OPS[o['h'+i+'1']](OPS[o['h'+i+'0']](g[i][0],g[i][1]),g[i][2])), c=[0,1,2].map(j=>OPS[o['v'+j+'1']](OPS[o['v'+j+'0']](g[0][j],g[1][j]),g[2][j])); return {r,c}; }
const KISI_LV={1:{nama:'Mudah',ops:6,angka:0},2:{nama:'Sedang',ops:3,angka:1},3:{nama:'Sulit',ops:0,angka:2}};
function kisiItem(lv,vid){
  const L0=KISI_LV[lv||1]||KISI_LV[1], L=vid==='angka'?{nama:L0.nama,ops:12,angka:L0.angka+2}:L0, bagi=vid==='bagi', ok=bagi?['+','−','×','÷']:['+','−','×'];
  for(let t=0;t<(bagi?6000:300);t++){ const g=[0,1,2].map(()=>[0,1,2].map(()=>RN.int(1,9))), o={}; KSLOTS.forEach(k=>o[k]=RN.pick(ok));
    if(bagi&&(!KSLOTS.some(k=>o[k]==='÷')||!kisiInt(g,o))) continue;
    const ev=kisiEval(g,o); if(ev.r.concat(ev.c).some(v=>v<0||v>50)) continue;
    const fx={}; RN.shuf(KSLOTS.slice()).slice(0,L.ops).forEach(k=>fx[k]=o[k]);
    const hid=RN.shuf([0,1,2,3,4,5,6,7,8]).slice(0,L.angka).map(x=>[Math.floor(x/3),x%3]);
    const isHid=(i,j)=>hid.some(h=>h[0]===i&&h[1]===j);
    return {perintah:'Kisi operasi ('+L.nama+')', kisi:{g,rows:ev.r,cols:ev.c,fixed:fx,sol:o,hid,lv:lv||1,ops:ok}, kunci:0,
      check:K=>{ const s=Object.assign({},fx,K.st.ops||{}); if(KSLOTS.some(k=>!s[k])) return false; const nn=K.st.nums||{};
        const gg=g.map((r,i)=>r.map((v,j)=>isHid(i,j)?nn[i+''+j]:v)); if(gg.some(r=>r.some(v=>!(v>=1&&v<=9)))) return false;
        const e=kisiEval(gg,s); if(!kisiInt(gg,s)) return false; return e.r.every((v,i)=>v===ev.r[i])&&e.c.every((v,i)=>v===ev.c[i]); },
      langkah:['Mulai dari baris atau kolom yang paling banyak terisi.',
        'Contoh jawaban: '+[0,1,2].map(i=>'('+g[i][0]+' '+o['h'+i+'0']+' '+g[i][1]+') '+o['h'+i+'1']+' '+g[i][2]+' = '+fmt(ev.r[i])).join('; ')+'.',
        'Susunan lain juga diterima selama semua baris dan kolom benar.']}; }
  return null;
}

/* ---------- Game 4: Detektif Barisan ---------- */
const BV={
  tengah:()=>{ let t, why; if(RN.chance(.6)){ const d=RN.pick([-1,1])*RN.int(2,8), a=d>0?RN.int(2,30):RN.int(7*(-d)+2,70); t=[]; for(let i=0;i<7;i++) t.push(a+i*d); why='Beda tetap '+sg(d); }
      else { const a=RN.int(1,4), r=2; t=[]; for(let i=0;i<6;i++) t.push(a*Math.pow(r,i)); why='Rasio tetap × '+r; }
    const k=RN.int(2,t.length-3), cells=t.map((v,i)=>i===k?{q:1}:{v});
    return {perintah:'Suku yang hilang: '+t.map((v,i)=>i===k?'…':fmt(v)).join(', '),kp:1,bar:{tag:'Cari suku yang hilang',cells},kunci:t[k],langkah:[why,'Suku ke-'+(k+1)+' = '+fmt(t[k])]}; },
  tingkat:()=>{ const a=RN.int(1,9), d0=RN.int(1,3), e=RN.pick([1,1,2]), t=[a]; for(let i=1;i<7;i++) t.push(t[i-1]+d0+(i-1)*e); const ds=t.slice(1).map((v,i)=>v-t[i]);
    return {perintah:'Lanjutkan: '+t.slice(0,6).map(fmt).join(', ')+', …',kp:1,bar:{cells:t.slice(0,6).map(v=>({v})).concat([{q:1}])},kunci:t[6],langkah:['Selisih: '+ds.slice(0,5).join(', ')+' (naik '+e+')','Selisih berikutnya '+ds[5]+', jadi '+fmt(t[5])+' + '+ds[5]+' = '+fmt(t[6])]}; },
  fibo:()=>{ const t=[RN.int(1,4),RN.int(1,4)]; for(let i=2;i<7;i++) t.push(t[i-1]+t[i-2]);
    return {perintah:'Lanjutkan: '+t.slice(0,6).map(fmt).join(', ')+', …',kp:1,bar:{cells:t.slice(0,6).map(v=>({v})).concat([{q:1}])},kunci:t[6],langkah:['Tiap suku = jumlah dua suku sebelumnya','Suku ke-7 = '+t[4]+' + '+t[5]+' = '+t[6]]}; },
  kesuku:()=>{ const a=RN.int(1,10), d=RN.int(2,5), n=RN.int(10,20), v=a+(n-1)*d;
    return {perintah:'Suku ke-'+n+' dari '+[0,1,2,3,4].map(i=>a+i*d).join(', ')+', …',kp:1,bar:{tag:'Suku ke-'+n,cells:[0,1,2,3,4].map(i=>({v:a+i*d})).concat([{blank:1},{q:1,ix:n}])},kunci:v,langkah:['Beda '+d,'U'+n+' = '+a+' + ('+n+' − 1) × '+d+' = '+v]}; }
};
function barisanItem(i,vid){
  if(BV[vid]) return BV[vid]();
  const MO={selang:0,bergantian:1,salah:2,mundur:3}, mode=vid in MO?MO[vid]:RN.int(0,3);
  if(mode===0){ const a=RN.int(1,10), b=RN.int(20,40), d1=RN.int(2,5), d2=-RN.int(1,3); const t=[]; for(let i=0;i<4;i++){ t.push(a+i*d1,b+i*d2); }

function gameBentuk(id,max){ const L=(GVAR[id]||[]).filter(v=>!v.need||has(...v.need)); if(!L.length) return null;
  const k=ymd(new Date()); S.gday=S.gday||{}; S.gseen=S.gseen||{}; const cur=S.gday[id];
  if(cur&&cur.k===k){ const l=cur.ids.map(x=>L.find(v=>v.id===x)); if(l.every(Boolean)) return l; }
  const last=S.gseen[id]||{}, sc={}; L.forEach(v=>{ sc[v.id]=(last[v.id]==null?-1e4:last[v.id])+Math.random(); });
  const t=tahap('PK'), fill=t===1?['geser','lama','baru']:t===2?['geser','baru','lama']:['baru','geser','lama'];
  const out=[], best=j=>L.filter(v=>v.j===j&&!out.includes(v)).sort((a,b)=>sc[a.id]-sc[b.id])[0];
  ['lama','geser','baru'].forEach(j=>{ const v=best(j); if(v) out.push(v); });
  while(out.length<Math.min(max||4,L.length)){ let v=null; for(const j of fill){ v=best(j); if(v) break; } if(!v) break; out.push(v); }
  const d=dayNo(); out.forEach(v=>{ last[v.id]=d; }); S.gseen[id]=last; S.gday[id]={k,ids:out.map(v=>v.id)}; save(); return out; }

const nf=v=>v==null?'':fmt(v);

function keypad(K,it){
  const need=it.needSel!=null&&K.st.sel==null, dis=isNaN(parseNum(K.ans))||need;
  return '<div class="kpwrap">'+(need&&!it.ask&&!it.bar?'<p class="sm kphint">Ketuk balok yang salah dulu.</p>':'')+'<div class="kpad">'+['1','2','3','4','5','6','7','8','9','±','0','⌫'].map(k=>'<button data-action="kp" data-v="'+k+'"'+(k==='±'||k==='⌫'?' class="fn"':'')+'>'+k+'</button>').join('')+'</div>'+
    '<button class="btn pri block" data-action="klcheck" id="pbtn"'+(dis?' disabled':'')+'>'+(K.game==='mesin'?'Jalankan mesin':'Periksa')+'</button></div>';
}
function kpPress(v){ const K=V.kl; if(!K||K.fb) return; let a=K.ans||'';
  if(v==='⌫') a=a.slice(0,-1); else if(v==='±') a=a.startsWith('-')?a.slice(1):'-'+a; else if(/^[0-9]$/.test(v)&&a.replace('-','').length<7) a=(a==='0'?'':a==='-0'?'-':a)+v;
  K.ans=a; render(); }

/* ---------- Mesin Fungsi ---------- */
function gvMesin(it,K,rv){ const m=it.mesin, a=K.ans?K.ans.replace('-','−'):'', bad=rv&&K.fb&&!K.fb.ok, sel=K.st.sel, st=(rv?' run':'')+(bad?' bad':rv?' ok':'');
  const box=t=>'<span class="mbox2"><span class="gr g1">'+GEAR+'</span><span class="gr g2">'+GEAR+'</span><span class="mscr">'+esc(t)+'</span><span class="lmp"></span></span>';
  const hist=(P,lab,ch)=>'<div class="mhist2'+(ch?' ch':'')+'">'+(lab?'<span class="mlab">'+lab+'</span>':'')+P.map((p,i)=>{ const pk=m.pick&&!rv, tag=pk?'button':'span';
    return '<'+tag+' class="mh'+(m.pick?' pk':'')+(pk&&sel===i?' sel':'')+(rv&&m.pick&&i===it.needSel?' was':'')+'"'+(pk?' data-action="gx" data-v="p'+i+'"':'')+'><b>'+nf(p[0])+'</b><i></i><b class="o">'+nf(p[1])+'</b></'+tag+'>'; }).join('')+'</div>';
  let h=m.ctx?'<p class="gctx"><b>'+esc(m.ctx.c)+'</b><span>'+esc(m.ctx.iu)+' → '+esc(m.ctx.ou)+'</span></p>':'';
  if(m.chain){ h+=m.chain.map(c=>hist(c.pairs,c.lab,1)).join('');
    h+='<div class="mline ch'+st+'"><span class="mtok in">'+nf(m.x)+'</span><span class="belt2"></span>'+box(rv?m.chain[0].rule:'A')+'<span class="belt2"></span>'+box(rv?m.chain[1].rule:'B')+'<span class="belt2"></span><span class="mtok out typed">'+(rv?nf(it.kunci):(a||'?'))+'</span></div>'; }
  else { const mund=m.x==null&&m.y!=null;
    const inV=m.pick?(sel!=null?nf(m.pairs[sel][0]):'?'):m.opt?'x':mund?(a||'?'):nf(m.x), outV=m.pick?(a||'?'):m.opt?'?':mund?nf(m.y):(a||'?');
    h+=hist(m.pairs)+'<div class="mline'+st+'"><span class="mtok in'+(mund&&!m.pick?' typed':'')+'">'+inV+'</span><span class="belt2"></span>'+box(rv?m.rule:'f(x)')+
      '<span class="belt2"></span><span class="mtok out'+(!mund&&!m.opt?' typed':'')+'">'+outV+'</span></div>'; }
  if(it.ask) h+='<p class="gq ask2">'+esc(it.ask)+'</p>';
  if(it.opsi) h+='<div class="klo">'+it.opsi.map((o,i)=>{ let c='opt'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+LTR[i]+'</span><span class="grow">'+mx(o)+'</span></button>'; }).join('')+'</div>';
  return h; }
function gxMesin(it,K,v){ if(v[0]==='p'&&it.mesin.pick) K.st.sel=+v.slice(1); }

/* ---------- Kisi Operasi: pilih lingkaran/kotak, lalu isi simbol atau angka ---------- */
function kisiHid(z,i,j){ return (z.hid||[]).some(h=>h[0]===i&&h[1]===j); }
function kisiLeft(it,K){ const z=it.kisi, o=Object.assign({},z.fixed,K.st.ops||{}), nn=K.st.nums||{}; return KSLOTS.filter(k=>!o[k]).length+(z.hid||[]).filter(h=>!nn[h[0]+''+h[1]]).length; }
function gvKisi(it,K,rv){ if(!rv&&K.st.slot==null) K.st.slot=kisiNext(it,K); const z=it.kisi, g0=z.g, o=Object.assign({},z.fixed,K.st.ops||{}), nn=K.st.nums||{}, sel=K.st.slot;
  const num=(i,j)=>kisiHid(z,i,j)?nn[i+''+j]:g0[i][j];
  const slot=k=>{ const f=z.fixed[k]!=null, v=o[k]; return '<button class="oslot'+(f?' fix':v?' set':'')+(sel===k&&!rv?' on':'')+'" data-action="gx" data-v="s'+k+'"'+(f||rv?' disabled':'')+'>'+(v||'')+'</button>'; };
  const cell=(i,j)=>{ if(!kisiHid(z,i,j)) return '<td class="n">'+g0[i][j]+'</td>'; const k='n'+i+j, v=nn[i+''+j];
    return '<td class="n hid'+(sel===k&&!rv?' on':'')+(v?' set':'')+'"><button data-action="gx" data-v="c'+i+j+'"'+(rv?' disabled':'')+'>'+(v||'')+'</button></td>'; };
  const line=(isR,i)=>{ const ks=isR?['h'+i+'0','h'+i+'1']:['v'+i+'0','v'+i+'1'], ns=isR?[[i,0],[i,1],[i,2]]:[[0,i],[1,i],[2,i]];
    if(ks.some(k=>!o[k])||ns.some(([a,b])=>!num(a,b))) return ''; const x=ns.map(([a,b])=>num(a,b)); const v=OPS[o[ks[1]]](OPS[o[ks[0]]](x[0],x[1]),x[2]);
    return v===(isR?z.rows[i]:z.cols[i])?' ok':' no'; };
  let h='<div class="tw"><table class="kisi2">';
  for(let i=0;i<3;i++){ h+='<tr>'+[0,1,2].map(j=>cell(i,j)+(j<2?'<td class="o">'+slot('h'+i+j)+'</td>':'')).join('')+'<td class="eq">=</td><td class="r'+line(true,i)+'">'+nf(z.rows[i])+'</td></tr>';
    if(i<2) h+='<tr>'+[0,1,2].map(j=>'<td class="o">'+slot('v'+j+i)+'</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr>'; }
  h+='<tr>'+[0,1,2].map(j=>'<td class="eq">=</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr><tr>'+[0,1,2].map(j=>'<td class="r'+line(false,j)+'">'+nf(z.cols[j])+'</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr></table></div>';
  if(!rv){ const left=kisiLeft(it,K), isN=sel&&sel[0]==='n';
    h+='<div class="kpwrap"><div class="kleft"><span>Sisa <b>'+left+'</b></span></div>'+
      (isN?'<div class="dpal">'+[1,2,3,4,5,6,7,8,9].map(d=>'<button data-action="gx" data-v="d'+d+'">'+d+'</button>').join('')+'<button class="fn" data-action="gx" data-v="x">⌫</button></div>'
          :'<div class="opal" style="grid-template-columns:repeat('+((z.ops||[]).length+1)+',1fr)">'+(z.ops||['+','−','×']).map(s=>'<button data-action="gx" data-v="o'+s+'"'+(sel?'':' disabled')+'>'+s+'</button>').join('')+'<button class="fn" data-action="gx" data-v="x"'+(sel&&o[sel]&&!z.fixed[sel]?'':' disabled')+'>⌫</button></div>')+
      '<button class="btn pri block" data-action="klcheck" id="pbtn"'+(left?' disabled':'')+'>Periksa</button></div>'; }
  return h; }
function kisiNext(it,K){ const z=it.kisi, o=K.st.ops||{}, nn=K.st.nums||{};
  const a=KSLOTS.filter(k=>z.fixed[k]==null&&!o[k]).map(k=>k).concat((z.hid||[]).filter(h=>!nn[h[0]+''+h[1]]).map(h=>'n'+h[0]+h[1]));
  return a[0]||null; }
function gxKisi(it,K,v){ const o=K.st.ops=K.st.ops||{}, nn=K.st.nums=K.st.nums||{};
  if(v[0]==='s'){ K.st.slot=v.slice(1); return; }
  if(v[0]==='c'){ K.st.slot='n'+v.slice(1); return; }
  const s=K.st.slot; if(!s) return;
  if(v==='x'){ if(s[0]==='n') delete nn[s.slice(1)]; else delete o[s]; return; }
  if(v[0]==='o'&&s[0]!=='n'){ o[s]=v.slice(1); K.st.slot=kisiNext(it,K); }
  if(v[0]==='d'&&s[0]==='n'){ nn[s.slice(1)]=+v.slice(1); K.st.slot=kisiNext(it,K); } }

/* ---------- Detektif Barisan: suku di jalur, lompatan di atasnya ---------- */
function dLbl(a,b){ const d=b-a; return (d<0?'−':'+')+fmt(Math.abs(d)); }
function rLbl(a,b){ return a!==0&&b%a===0&&b/a>=2&&b/a<=9?'×'+(b/a):''; }
function gvBarisan(it,K,rv){ const B=it.bar, cs=B.cells, n=cs.length, L=K.st.lup||{}, a=K.ans?K.ans.replace('-','−'):'';
  const W=340, x0=26, dx=(W-2*x0)/(n-1), X=i=>x0+i*dx, Y=96, sk=!!K.st.skip, H=sk?196:136;
  let s='<svg class="bsvg" viewBox="0 0 '+W+' '+H+'"><line x1="8" y1="'+Y+'" x2="'+(W-8)+'" y2="'+Y+'" class="rail"/>';
  for(let i=0;i<n-1;i++){ const c=cs[i], d=cs[i+1], x1=X(i)+15, x2=X(i+1)-15, mx=(X(i)+X(i+1))/2, ok=c.v!=null&&d.v!=null;
    s+='<path d="M'+x1+' '+(Y-20)+' Q'+mx+' '+(Y-62)+' '+x2+' '+(Y-20)+'" class="hop'+(ok?'':' dash')+'"/>';
    if(false){ const on=L[i]; s+='<g class="hb'+(on?' on':'')+'"'+(on||rv?'':' data-action="gx" data-v="g'+i+'"')+'><rect x="'+(mx-19)+'" y="'+(Y-62)+'" width="38" height="'+(on&&rLbl(c.v,d.v)?30:20)+'" rx="7"/>'+
      (on?'<text x="'+mx+'" y="'+(Y-48)+'">'+esc(dLbl(c.v,d.v))+'</text>'+(rLbl(c.v,d.v)?'<text x="'+mx+'" y="'+(Y-37)+'" class="r">'+rLbl(c.v,d.v)+'</text>':''):'<text x="'+mx+'" y="'+(Y-48)+'">🔍</text>')+'</g>'; } }
  if(sk) for(let i=0;i<n-2;i++){ const c=cs[i], d=cs[i+2]; if(c.v==null||d.v==null) continue; const x1=X(i), x2=X(i+2), mx=(x1+x2)/2, y=Y+20+(i%2?30:0);
    s+='<path d="M'+x1+' '+(Y+18)+' Q'+mx+' '+(y+34)+' '+x2+' '+(Y+18)+'" class="hop low"/><text x="'+mx+'" y="'+(y+24)+'" class="sl">'+esc(dLbl(c.v,d.v))+'</text>'; }
  cs.forEach((c,i)=>{ const x=X(i), sel=K.st.sel===i, val=c.blank?'…':c.q?(rv?nf(it.kunci):(a||'?')):(sel&&!rv?(a||'?'):nf(c.v));
    const cls='stn'+(c.q?' q':'')+(c.blank?' bl':'')+(sel?' sel':'')+(rv&&it.needSel===i?' was':'')+(B.pick&&!rv?' pk':'');
    s+='<g class="'+cls+'"'+(B.pick&&!rv?' data-action="gx" data-v="s'+i+'"':'')+'><rect x="'+(x-17)+'" y="'+(Y-18)+'" width="34" height="36" rx="8"/><text x="'+x+'" y="'+(Y+6)+'" class="v'+(String(val).length>3?' sm':'')+'">'+esc(val)+'</text><text x="'+x+'" y="'+(Y+32)+'" class="ix">'+(c.ix||i+1)+'</text>'+
      (sel&&!rv?'<text x="'+x+'" y="'+(Y-24)+'" class="old">'+nf(c.v)+'</text>':'')+'</g>'; });
  s+='</svg>';
  const pm=(B.hint||'').match(/× (\d+) dan \+ (\d+)/), tag=B.tag||(B.pick?'Cari yang salah catat':cs[0].q?'Cari suku pertama':'Lanjutkan barisan');
  let h='<div class="btag"><span class="lbl g">'+tag+'</span>'+''+'</div>'+s;
  const known=cs.filter(c=>c.v!=null).length;
  if(false) h+='<div class="bctl"><button class="chip'+(sk?' on':'')+'" data-action="gx" data-v="skip"'+(rv?' disabled':'')+'>Lompat selang satu</button>'+'</div>';
  return h; }
function gxBarisan(it,K,v){ if(v==='skip'){ K.st.skip=!K.st.skip; return; } if(v[0]==='g'){ (K.st.lup=K.st.lup||{})[+v.slice(1)]=1; return; } if(v[0]==='s'){ K.st.sel=+v.slice(1); } }

/* ---------- Timbangan P–Q ---------- */
function dropOf(z,kunci){ return kunci===0?26:kunci===1?14:kunci===2?0:kunci===3?-20:0; }
function coretRest(K,side,arr){ const c=K.st['c'+side]||[]; const r=arr.filter((_,i)=>!c.includes(i)); return r.length?r.map(x=>x.t).join(' × '):'1'; }
function gvPQ(it,K,rv){ const z=it.pqv, C=it.coret, cp=K.st.cp||[], cq=K.st.cq||[], side=s=>C?chips(s==='p'?C.P:C.Q,s,s==='p'?cp:cq):'<b class="pqt">'+mx(s==='p'?z.P:z.Q)+'</b>';
  const d=rv?dropOf(z,it.kunci):0, wob=rv&&it.kunci===4, yL=40+d, yR=40-d, ang=Math.atan2(d,75)*180/Math.PI;
  const chips=(arr,side,cut)=>arr.map((x,i)=>{ const sel=K.st['s'+side]===i, gone=cut.includes(i);
    return (i?'<span class="tx">×</span>':'')+'<button class="fac'+(gone?' cut':'')+(sel?' sel':'')+(K.st.miss&&sel?' miss':'')+'" data-action="gx" data-v="'+side+i+'"'+(gone||rv?' disabled':'')+'>'+mx(x.t)+'</button>'; }).join('');
  const val=s=>rv&&z.smp.length===1?'<em>= '+fmt(s==='p'?z.smp[0].p:z.smp[0].q)+'</em>':'';
  let h=!z.info||/^Perhatikan/.test(z.info)?'':'<p class="pqinfo">'+esc(z.info)+'</p>';
  h+='<div class="ner'+(wob?' wob':'')+(rv?' go':'')+'" style="--d:'+d+'"><svg viewBox="0 0 300 200" aria-hidden="true">'+
    '<rect x="110" y="182" width="80" height="12" rx="6" class="base"/><rect x="146" y="40" width="8" height="144" rx="4" class="post"/>'+
    '<g class="arm" style="--ang:'+(-ang)+'deg"><rect x="66" y="36" width="168" height="9" rx="4.5" class="beam2"/><circle cx="150" cy="40" r="7" class="piv"/></g>'+
    '<line x1="75" y1="'+yL+'" x2="75" y2="'+(yL+28)+'" class="str sl"/><line x1="225" y1="'+yR+'" x2="225" y2="'+(yR+28)+'" class="str sr"/></svg>'+
    '<div class="plate l" style="--pd:'+d+';top:'+((yL+28)/2)+'%"><small>P</small><span class="facs">'+side('p')+'</span>'+val('p')+'</div>'+
    '<div class="plate r" style="--pd:'+(-d)+';top:'+((yR+28)/2)+'%"><small>Q</small><span class="facs">'+side('q')+'</span>'+val('q')+'</div></div>';
  const done=cp.length;
  if(C) h+='<p class="coret2">'+(K.st.miss?'<b class="no">Belum sama</b>':done?'Sisa: <b>P = '+mx(coretRest(K,'p',C.P))+'</b> · <b>Q = '+mx(coretRest(K,'q',C.Q))+'</b>':'&nbsp;')+'</p>';
  h+='<div class="zones">'+PQ5.map((o,i)=>{ let c='zone'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+LTR[i]+'</span><span>'+o+'</span></button>'; }).join('')+'</div>';
  return h; }
function gxPQ(it,K,v){ const side=v[0], i=+v.slice(1), C=it.coret; K.st.miss=false;
  K.st['s'+side]=i; const sp=K.st.sp, sq=K.st.sq; if(sp==null||sq==null) return;
  if(C.P[sp].k===C.Q[sq].k){ (K.st.cp=K.st.cp||[]).push(sp); (K.st.cq=K.st.cq||[]).push(sq); K.st.sp=K.st.sq=null; }
  else { K.st.miss=true; setTimeout(()=>{ if(V.kl===K&&K.st.miss){ K.st.miss=false; K.st.sp=K.st.sq=null; render(); } },700); } }

/* ---------- Cukup Nggak?: Beli Petunjuk ---------- */
function gvCukup(it,K,rv){ const z=it.ck, op=K.st.open||[], spent=K.st.spent||0, left=CK_KOIN-spent, L=it.opsi;
  let h='<div class="ckhead"><span></span><span class="coins" aria-label="Koin '+left+'">'+[0,1,2].map(i=>'<i class="'+(i<left?'on':'')+'"></i>').join('')+'<b>'+left+' koin</b></span></div><p class="ask ckq">'+esc(z.q)+'</p>';
  h+='<div class="ckst">'+z.s.map((s,i)=>{ const o=op.includes(i)||rv;
    return o?'<div class="ckc open"><b>'+z.lab[i]+'</b><span>'+esc(s)+'</span></div>':'<button class="ckc lock" data-action="gx" data-v="o'+i+'"'+(left?'':' disabled')+'><b>'+z.lab[i]+'</b><span class="lk">Buka · 1 koin</span></button>'; }).join('')+'</div>';
  if(K.st.tip||rv) h+='<div class="cktip"><span class="cap">Petunjuk</span>'+esc(z.tip)+'</div>';
  else h+='<button class="chip tipb" data-action="gx" data-v="tip"'+(left?'':' disabled')+'>Petunjuk · 1 koin</button>';
  if(z.ask2) h+='<p class="gq ask2">'+esc(z.ask2)+'</p>';
  h+='<div class="klo">'+L.map((o,i)=>{ let c='opt'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+LTR[i]+'</span><span class="grow">'+esc(o)+'</span></button>'; }).join('')+'</div>';
  return h; }
function gxCukup(it,K,v){ const left=CK_KOIN-(K.st.spent||0); if(left<=0) return;
  if(v==='tip'){ if(!K.st.tip){ K.st.tip=1; K.st.spent=(K.st.spent||0)+1; } return; }
  const i=+v.slice(1), op=K.st.open=K.st.open||[]; if(!op.includes(i)){ op.push(i); K.st.spent=(K.st.spent||0)+1; } }

/* ---------- Paling Mendekati ---------- */
function gvDekat(it,K,rv){ const z=it.est, o=z.o, step=o[1]-o[0], pos=v=>Math.max(3,Math.min(97,10+(v-o[0])/step*20));
  let h='<div class="expr">'+(z.np?'':'<small>≈</small> ')+mx(z.e)+'</div>';
  h+='<div class="nline"><span class="track"></span>'+o.map((v,i)=>{ let c='flag'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" style="left:'+(10+i*20)+'%" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><b>'+fmt(v)+'</b><i></i></button>'; }).join('')+
    (rv?'<span class="truev" style="left:'+pos(z.v)+'%"><b>'+fmt(Math.round(z.v*100)/100)+'</b></span>':'')+'</div>';
  return h; }

const GV={mesin:gvMesin,kisi:gvKisi,barisan:gvBarisan,pq:gvPQ,cukup:gvCukup,dekat:gvDekat};
const GX={kisi:gxKisi,barisan:gxBarisan,pq:gxPQ,cukup:gxCukup,mesin:gxMesin};

/* Kisi dengan satu susunan simbol yang benar (untuk kunci dan halaman hasil) */
function kisiSolved(it){ const z=it.kisi, g=z.g, o=z.sol;
  const sl=k=>'<span class="oslot '+(z.fixed[k]!=null?'fix':'set')+'">'+o[k]+'</span>';
  let h='<div class="tw"><table class="kisi2 mini">';
  for(let i=0;i<3;i++){ h+='<tr>'+g[i].map((v,j)=>'<td class="n'+(kisiHid(z,i,j)?' hidk':'')+'">'+v+'</td>'+(j<2?'<td class="o">'+sl('h'+i+j)+'</td>':'')).join('')+'<td class="eq">=</td><td class="r ok">'+nf(z.rows[i])+'</td></tr>';
    if(i<2) h+='<tr>'+[0,1,2].map(j=>'<td class="o">'+sl('v'+j+i)+'</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr>'; }
  h+='<tr>'+[0,1,2].map(j=>'<td class="eq">=</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr><tr>'+[0,1,2].map(j=>'<td class="r ok">'+nf(z.cols[j])+'</td>'+(j<2?'<td></td>':'')).join('')+'<td></td><td></td></tr></table></div>';
  return h; }

/* ---------- Tampilan ---------- */

  const sw=(on,act,label)=>'<div class="row"><b class="grow">'+label+'</b><button class="sw'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" aria-label="'+label+'" data-action="'+act+'"><i></i></button></div>';

function optBtn(i,label,R,k,rv){ const q=R.items[k].q, a=R.A[k]; let cls='opt'; if(a.c===i) cls+=' sel'; if(rv){ if(i===q.kunci) cls+=' good'; else if(a.c===i) cls+=' wrong'; }
  const why=rv&&q.alasan&&q.alasan[i]&&i!==q.kunci&&!/^kunci\.?$/i.test(q.alasan[i])?'<span class="why">'+mx(q.alasan[i])+'</span>':'';
  return '<button class="'+cls+'" data-action="pick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+'ABCDE'[i]+'</span><span class="grow">'+txt(label)+why+'</span></button>'; }

  h+='<div class="card q">'+q.teks.map(p=>'<p>'+txt(p)+'</p>').join('')+tabel(q.tabel)+'<p class="ask">'+txt(q.perintah)+'</p>';
  if(a.prev) h+='<p class="sm">Soal ini sudah dijawab sebelumnya ('+(a.ok?'benar':'salah')+').</p>';

  else if(q.tipe==='bs') h+='<div class="bs">'+q.bs.map((b,i)=>'<div class="bsr'+(rv?(a.bs[i]===b.benar?' good':' wrong'):'')+'"><span class="grow">'+txt(b.teks)+'</span>'+[true,false].map(v=>'<button data-action="bs" data-v="'+i+':'+(v?1:0)+'" class="'+(a.bs[i]===v?'sel':'')+(rv&&b.benar===v?' key':'')+'"'+(rv?' disabled':'')+'>'+(v?'Benar':'Salah')+'</button>').join('')+'</div>').join('')+'</div>';
  else h+='<div class="isi"><input id="isian" inputmode="decimal" autocomplete="off" placeholder="jawaban angka" value="'+esc(a.is)+'"'+(rv?' disabled':'')+'><span class="sm">Desimal pakai koma, tanpa satuan.</span></div>';
  h+='</div>';
  if(rv||a.prev) h+=pembahasan(q,a);
  const last=k===n-1, allDone=R.A.every(x=>x.done);
  h+='<div class="btns foot">'+(k>0?'<button class="btn" data-action="prev">Sebelumnya</button>':'');

  else h+='<button class="btn pri grow" data-action="'+(last?'selesai':'next')+'" id="pbtn">'+(last?'Selesai dan periksa':'Lanjut')+'</button>';

function pembahasan(q,a){
  let key=q.tipe==='pg'?'ABCDE'[q.kunci]+'. '+q.opsi[q.kunci]:q.tipe==='pq'?pqList(q)[q.kunci]:q.tipe==='cukup'?ckList(q)[q.kunci]:q.tipe==='bs'?q.bs.map((b,i)=>(i+1)+' '+(b.benar?'Benar':'Salah')).join(' · '):fmt(q.kunciNum);
  let h='<div class="card pb '+(a.ok?'good':'wrong')+'"><b>'+(a.ok?'Benar':'Belum tepat')+'</b><p class="kunci">Kunci: '+mx(key)+'</p>';
  if(q.langkah.length) h+=stepsFold(q.langkah,3);
  if(q.jebakan) h+='<p class="sm"><b>Jebakan:</b> '+mx(q.jebakan)+'</p>';
  h+='</div>';
  return h;
}

function hearts(n){ return [0,1,2].map(i=>'<i class="hrt'+(i<n?'':' off')+'">♥</i>').join(''); }
function gameHud(K){ return '<div class="hud"><span class="lives" aria-label="Nyawa '+K.lives+'">'+hearts(K.lives)+'</span><span class="combo'+(K.combo>=3?' on':'')+'">'+(K.combo>=3?'Kombo ×'+comboMul(K.combo):K.combo?'Beruntun '+K.combo:'Kombo')+'</span><span class="pts">'+K.score+' poin</span></div>'; }
function gameEnd(K,ok){ const st=K.stars||1, b=S.gbest[K.game]||{skor:0};
  return '<div class="card gend">'+(K.over&&K.res.length<K.items.length?'<p class="sm">Nyawa habis di soal '+K.res.length+'.</p>':'')+'<div class="stars">'+[1,2,3].map(i=>'<i class="'+(i<=st?'on':'')+'">★</i>').join('')+'</div><b class="big">'+K.score+'</b><span class="sm">poin · kombo terpanjang '+K.maxc+'</span>'+(K.rekor?'<span class="rekor">Rekor baru!</span>':'<span class="sm">Rekor: '+b.skor+' poin</span>')+'</div>'; }
function klLbl(K){ const g=K.game&&GMAP[K.game]; return '<span class="lbl'+(g&&!g.yk?' w':'')+'" style="--lc:'+(g?g.c:'var(--yellow)')+'">'+esc(K.title)+'</span>'; }
const CHEVI='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
function stepsFold(L,n){ if(!L||!L.length) return ''; const a=L.slice(0,n), b=L.slice(n); return '<ol class="steps">'+a.map(x=>'<li>'+mx(x)+'</li>').join('')+'</ol>'+(b.length?'<details class="more"><summary>Langkah lengkap '+CHEVI+'</summary><ol class="steps" start="'+(n+1)+'">'+b.map(x=>'<li>'+mx(x)+'</li>').join('')+'</ol></details>':''); }
function klKey(it){ if(it.kisi) return 'contoh susunan yang benar di kisi berikut (susunan lain juga diterima)'; return it.opsi?LTR[it.kunci]+'. '+it.opsi[it.kunci]:fmt(it.kunci); }
function viewKilat(){
  if(V.kl&&V.kl.intro) return viewIntro(V.kl);
  const K=V.kl, tgt=K.limit||20, back=K.game?'#game':'#beranda';
  if(K.done){ const ok=K.res.filter(r=>r.ok).length, n=K.res.length, avg=n?K.res.reduce((s,r)=>s+r.ms,0)/n/1000:0;
    return '<header class="top run still"><button class="btn sm" data-action="klclose">‹ Kembali</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" style="visibility:hidden">0</span></header>'+(K.game?gameEnd(K,ok):'')+'<div class="card score"><div><b class="big">'+ok+'/'+n+'</b><span class="sm">benar</span></div><div><b class="big">'+avg.toFixed(1).replace('.',',')+'</b><span class="sm">detik per soal · target '+tgt+'</span></div></div>'+
    (K.res.some(r=>!r.ok)?'<div class="fhead"><h2>Pembahasan yang salah</h2><button class="btn sm" data-action="foldall">Buka/tutup semua</button></div>'+K.res.map((r,ix)=>[r,ix]).filter(x=>!x[0].ok).map(([r,ix])=>'<details class="card fold"><summary><span class="num">'+(ix+1)+'</span><span class="grow snip1">'+esc(r.it.perintah.slice(0,64))+'</span>'+CHEVI+'</summary>'+(r.it.kisi?kisiSolved(r.it):r.it.html||'<p class="ask">'+mx(r.it.perintah)+'</p>')+'<p class="kunci">Kunci: '+mx(klKey(r.it))+'</p>'+stepsFold(r.it.langkah,3)+'</details>').join(''):'')+
    '<div class="btns foot"><button class="btn pri grow" data-action="klclose">Selesai</button><button class="btn" data-action="'+(K.game?'game':'kilat')+'" data-v="'+(K.game||'')+'">Main lagi</button></div>'; }
  const it=K.items[K.i], n=K.items.length, rv=!!K.fb;
  let h='<header class="top run"><button class="btn sm" data-action="klstop">‹ Selesai</button><span class="grow mid">'+klLbl(K)+'</span><span class="cd" id="kt">'+(K.limit?K.limit+' dtk':'0 dtk')+'</span></header>'+(K.game?gameHud(K):'')+bar(pct(K.i,n));

  if(it.opsi&&!gv){ h+='<div class="klo">'+it.opsi.map((o,i)=>{ let c='opt'; if(rv&&i===it.kunci) c+=' good'; else if(rv&&K.pick===i) c+=' wrong'; return '<button class="'+c+'" data-action="klpick" data-v="'+i+'"'+(rv?' disabled':'')+'><span class="lt">'+LTR[i]+'</span><span class="grow">'+mx(o)+'</span></button>'; }).join('')+'</div>'; }
  if(K.fb) h+=(K.game&&K.fb.ok?'<span class="gain">+'+K.fb.pts+(K.fb.mul>1?' · kombo ×'+K.fb.mul:'')+(K.fb.bonus?' · bonus koin +'+K.fb.bonus:'')+'</span>':K.game?'<span class="gain lose">−1 nyawa</span>':'')+'<p class="kunci">'+(K.fb.ok?'Benar':(K.fb.timeout?'Waktu habis. ':'')+'Kunci: '+mx(klKey(it)))+'</p>'+(!K.fb.ok&&it.kisi?kisiSolved(it):'')+(K.fb.ok?'':stepsFold(it.langkah,2))+'<button class="btn pri block" data-action="klnext" id="pbtn">'+(K.over?'Lihat hasil':'Lanjut')+'</button>';
  else if(gv&&it.kp) h+=keypad(K,it);

  return h+'</div>'+(gv?'</div>':'');
}

function render(){
  let r=route(), h, full=false;
  if(r==='main'){ if(V.run){ h=viewRun(); full=true; } else if(V.kl){ h=viewKilat(); full=true; } else if(V.hasil){ h=viewHasil(); full=true; } else { r='beranda'; } }
  if(!h) h=r==='game'?viewGame():r==='soal'?viewSoal():r==='salah'?viewSalah():r==='progres'?viewProgres():viewBeranda();
  $('#view').innerHTML=(full?'':appbar()+(hero(r)||'<div class="gap0"></div>'))+h; $('#nav').hidden=full;
  document.body.classList.remove('cbt'); /* semua halaman memakai tema lego */
  document.querySelectorAll('#view .card').forEach(c=>{ if(c.tagName!=='DETAILS') c.insertAdjacentHTML('afterbegin',STUDS); });
  const LC=['','g','bl','o']; let li=0;
  document.querySelectorAll('#view > h2').forEach(t=>{ const n=t.nextElementSibling; if(!n||n.tagName!=='DIV'||!n.classList.contains('card')||n.classList.contains('score')) return;
    const l=document.createElement('span'); l.className='lbl '+LC[li++%4]; l.innerHTML=t.innerHTML; n.insertBefore(l,n.querySelector(':scope > :not(.st)')); n.classList.add('has-lbl'); t.remove(); });
  const ns=salahList().length;
  $('#nav').innerHTML=NAV.map(x=>'<a href="#'+x[0]+'" class="'+(r===x[0]?'on ':'')+(x[0]==='beranda'?'yk':'')+'" style="--c:'+x[2]+'">'+svgI(x[3])+'<span>'+x[1]+'</span>'+(x[0]==='salah'&&ns?'<i>'+ns+'</i>':'')+'</a>').join('');
  const f=$('#klans')||(V.run&&!V.run.A[V.run.cur].done?$('#isian'):null); if(f&&!('ontouchstart' in window)) f.focus();
}

/* ---------- Aksi ---------- */
function act(a,v){
  const R=V.run, K=V.kl, Z=V.soal;
  if(a!=='reset') V.prog.reset=false;
  if(a==='kilat') startKilat();
  else if(a==='gosoal'){ Z.tab='harian'; Z.tgl=ymd(new Date()); Z.res=null; go('soal'); }
  else if(a==='gosim'){ Z.tab=v; Z.res=null; go('soal'); }
  else if(a==='mulai'){ const st=S.sets.find(x=>x.id===v); if(st) startSet(st); }
  else if(a==='resume'){ const o=loadSesi(); if(o){ V.run=o; V.hasil=null; go('main'); } }
  else if(a==='ulang') startUlang(salahList());
  else if(a==='ulang1'){ const it=findQ(v); if(it) startUlang([it]); }
  else if(a==='varian'){ const it=findQ(v); if(it) copyText(promptVarian(it.q,it.set),'Prompt varian disalin. Tempel hasilnya di Set soal.'); }
  else if(a==='paham'){ S.lunas[v]=Date.now(); save(); render(); }
  else if(a==='tab'){ Z.tab=v; Z.res=null; render(); }
  else if(a==='tgl'){ Z.tgl=v; render(); }
  else if(a==='copy'){ copyText($('#promptbox').value,'Prompt disalin. Jalankan di Claude.'); }

<style>

<script>
(function(){

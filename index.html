<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latihan Kuantitatif</title>
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--sf:#fff;--fill:#EEF0F4;--line:#E2E5EB;--ink:#1E2026;--mut:#6B7280;--acc:#3F6FDB;--acc-s:#E7EEFC;--ok:#1D8A4F;--ok-s:#E4F5EB;--bad:#C42F38;--bad-s:#FDECEC;--warn:#8A5A00;--mint:#DDF3E8;--mint-i:#17694A;--blue:#E1EBFB;--blue-i:#2A56B0;--coral:#FCE5DF;--coral-i:#A8432B;--lilac:#ECE6FA;--lilac-i:#5B3FA8;--sand:#F6EBD3;--sand-i:#7A5A12}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111317;--sf:#1B1E24;--fill:#262A32;--line:#2E333C;--ink:#ECEEF2;--mut:#9AA1AD;--acc:#7FA3F2;--acc-s:rgba(110,151,240,.16);--ok:#5AD394;--ok-s:rgba(61,196,126,.14);--bad:#F58A8F;--bad-s:rgba(240,100,106,.14);--warn:#F2B53D;--mint:#173428;--mint-i:#8FDDB9;--blue:#1A2A45;--blue-i:#A9C3F5;--coral:#3A211B;--coral-i:#F2B3A3;--lilac:#2A2240;--lilac-i:#C9B8F5;--sand:#33290F;--sand-i:#E8CF8E}}
:root[data-theme=dark]{--bg:#111317;--sf:#1B1E24;--fill:#262A32;--line:#2E333C;--ink:#ECEEF2;--mut:#9AA1AD;--acc:#7FA3F2;--acc-s:rgba(110,151,240,.16);--ok:#5AD394;--ok-s:rgba(61,196,126,.14);--bad:#F58A8F;--bad-s:rgba(240,100,106,.14);--warn:#F2B53D;--mint:#173428;--mint-i:#8FDDB9;--blue:#1A2A45;--blue-i:#A9C3F5;--coral:#3A211B;--coral-i:#F2B3A3;--lilac:#2A2240;--lilac-i:#C9B8F5;--sand:#33290F;--sand-i:#E8CF8E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
#view{max-width:640px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:22px;line-height:1.25;margin:8px 0 2px;font-weight:700}
h2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px;display:flex;gap:8px;align-items:center}
h2 .cnt{font-weight:600;letter-spacing:0;text-transform:none}
p{margin:0 0 8px}
.lead{color:var(--mut);font-size:13px;margin-bottom:4px}
.sm{font-size:12.5px;color:var(--mut);display:block}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;min-height:36px}
.top.run{position:sticky;top:0;background:var(--bg);z-index:5;padding:6px 0}
.hub{color:var(--acc);text-decoration:none;font-size:13px;font-weight:600;background:none;border:0;padding:6px 0;font-family:inherit;cursor:pointer}
.ttl{font-weight:700;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--mut);background:var(--fill);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
.cd.late{color:var(--bad);background:var(--bad-s)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.card.list{padding:2px 14px}
.card.note{display:flex;align-items:center;gap:10px;background:var(--sand);border-color:transparent;margin-top:12px}
.card.note .sm{color:var(--sand-i)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-size:14px;font-weight:600;display:block}
.row.done b{color:var(--mut)}
.num{width:22px;height:22px;border-radius:6px;background:var(--fill);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--mut)}
.row.done .num{background:var(--ok-s);color:var(--ok)}
.bar{display:block;height:4px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
.btn{font:600 13px/1 inherit;font-family:inherit;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;flex:none;min-height:36px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{color:#0E1320}}
:root[data-theme=dark] .btn.pri{color:#0E1320}
.btn.danger{color:var(--bad)}
.btn.ico{padding:9px 10px;color:var(--mut)}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.grow{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.btns.foot{margin:14px 0 0}
.bd{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap;flex:none}
.bd-mint{background:var(--mint);color:var(--mint-i)}.bd-blue{background:var(--blue);color:var(--blue-i)}.bd-coral{background:var(--coral);color:var(--coral-i)}
.bd-lama{background:var(--fill);color:var(--mut)}.bd-geser{background:var(--sand);color:var(--sand-i)}.bd-baru,.bd-varian{background:var(--lilac);color:var(--lilac-i)}
.code{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.chips b{font-size:13px;margin-right:8px}
.chip{font:600 12.5px inherit;font-family:inherit;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.chip.on{background:var(--acc-s);border-color:var(--acc);color:var(--acc)}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--acc);padding:4px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.resep{margin:8px 0 0;padding-left:22px;font-size:12.5px}
.resep li{margin-bottom:5px}.resep span:last-child{color:var(--mut)}
.seg{display:flex;background:var(--fill);border-radius:8px;padding:3px;margin:12px 0}
.seg button{flex:1;font:600 12.5px inherit;font-family:inherit;border:0;background:none;color:var(--mut);padding:7px 4px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--ink)}
.stephd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ta{width:100%;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.msg{border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
.msg ul{margin:4px 0;padding-left:18px}
.msg.bad{background:var(--bad-s);color:var(--bad)}.msg.ok{background:var(--ok-s);color:var(--ok)}
.snip{font-size:13.5px;margin:6px 0 0}
.srow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .lb{font-size:13.5px;font-weight:600}
.sv{text-align:right;flex:none;min-width:86px}.sv b{font-size:14px}
.dots{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.dots button{flex:none;width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--sf);font:600 11.5px inherit;font-family:inherit;color:var(--mut);cursor:pointer}
.dots .ans{background:var(--acc-s);color:var(--acc);border-color:transparent}
.dots .ok{background:var(--ok-s);color:var(--ok);border-color:transparent}
.dots .no{background:var(--bad-s);color:var(--bad);border-color:transparent}
.dots .cur{border-color:var(--ink);color:var(--ink)}
.qhd{display:flex;gap:8px;align-items:center;margin:2px 0 8px}
.stim{background:var(--fill);border-color:transparent;font-size:14.5px}
.q p,.stim p{margin-bottom:8px}
.ask{font-weight:600}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:13px;min-width:60%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:var(--fill);font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:14.5px/1.45 inherit;font-family:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:6px;cursor:pointer}
.opt .lt{width:22px;height:22px;border-radius:6px;background:var(--fill);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt.sel{border-color:var(--acc);background:var(--acc-s)}.opt.sel .lt{background:var(--acc);color:#fff}
.opt.good{border-color:var(--ok);background:var(--ok-s)}.opt.good .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-s)}.opt.wrong .lt{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.why{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.pq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.pq div{background:var(--fill);border-radius:8px;padding:8px 10px}
.pern{margin:4px 0 8px;padding-left:26px}
.pern li{margin-bottom:4px}
.bsr{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.bsr button{font:600 12px inherit;font-family:inherit;border:1px solid var(--line);background:var(--sf);color:var(--mut);border-radius:6px;padding:6px 8px;cursor:pointer;flex:none}
.bsr button.sel{background:var(--acc-s);border-color:var(--acc);color:var(--acc)}
.bsr button.key{border-color:var(--ok);color:var(--ok)}
.bsr.wrong button.sel{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.isi{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.isi input{font:600 17px inherit;font-family:inherit;color:var(--ink);background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:180px;max-width:100%}
.pb{font-size:14px}
.pb.good{border-color:var(--ok)}.pb.wrong{border-color:var(--bad)}
.pb>b{font-size:14px}.pb.good>b{color:var(--ok)}.pb.wrong>b{color:var(--bad)}
.kunci{font-weight:600;margin:4px 0}
.steps{margin:4px 0 8px;padding-left:20px}
.lbl{font-size:12px;color:var(--mut);margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.big{font-size:24px;font-weight:700;display:block;line-height:1.2}
.rev summary{display:flex;gap:8px;align-items:center;color:var(--ink)}
.rev .pb{border:0;padding:8px 0 0;margin:0;background:none}
.rev.good{border-left:3px solid var(--ok)}.rev.wrong{border-left:3px solid var(--bad)}
.snip1{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol{list-style:none;padding:0;margin:6px 0;font-size:14px}
.ol li{padding:4px 6px;border-radius:6px}.ol .k{background:var(--ok-s)}.ol .x{background:var(--bad-s)}
.kl{text-align:center;margin-top:12px}
.kl.good{border-color:var(--ok)}.kl.wrong{border-color:var(--bad)}
.klq{font-size:24px;font-weight:700;margin:12px 0}
.kl .isi{justify-content:center}.kl .steps{text-align:left}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#nav a{flex:1;max-width:160px;text-align:center;padding:14px 4px;font-size:12.5px;font-weight:600;color:var(--mut);text-decoration:none;border-top:2px solid transparent;margin-top:-1px}
#nav a.on{color:var(--acc);border-top-color:var(--acc)}
#nav i{font-style:normal;background:var(--bad-s);color:var(--bad);border-radius:8px;font-size:11px;padding:1px 5px;margin-left:4px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;border-radius:8px;padding:9px 14px;z-index:20;max-width:90vw;text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav" aria-label="Menu utama"></nav>
<div id="toast" role="status" hidden></div>
<script>
/* ---- util hitung + hitung cepat (dari versi lama) ---- */
const RN={
  int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  chance:p=>Math.random()<p,
  shuf:a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
};
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function lcm(a,b){ return a/gcd(a,b)*b; }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function factorize(n){ const f={}; for(let p=2;p*p<=n;p++) while(n%p===0){ f[p]=(f[p]||0)+1; n/=p; } if(n>1) f[n]=(f[n]||0)+1; return f; }
function nDiv(n){ return Object.values(factorize(n)).reduce((a,e)=>a*(e+1),1); }
function comb(n,k){ let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return Math.round(r); }
const MIN='−';
function fmt(x){
  if(typeof x!=='number') return String(x);
  const neg=x<0, r=Math.round(Math.abs(x)*100)/100;
  let [i,d]=r.toFixed(2).split('.');
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); d=d.replace(/0+$/,'');
  return (neg&&r!==0?MIN:'')+i+(d?','+d:'');
}
function rp(x){ return 'Rp'+fmt(x)+',00'; }
function sg(x){ return x<0?MIN+fmt(-x):fmt(x); }               // angka bertanda untuk ekspresi
function par(x){ return x<0?'('+MIN+fmt(-x)+')':fmt(x); }        // negatif dalam kurung
const SUPM={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','−':'⁻','+':'⁺','n':'ⁿ','x':'ˣ','(':'⁽',')':'⁾'};
function sup(s){ return String(s).split('').map(c=>SUPM[c]||c).join(''); }
function lg(b,x){ return (b===10?'':sup(b))+'log '+x; }
/* pecahan */
function F(n,d){ if(d<0){ n=-n; d=-d; } const g=gcd(n,d)||1; return {n:n/g,d:d/g}; }
function fadd(a,b){ return F(a.n*b.d+b.n*a.d,a.d*b.d); }
function fsub(a,b){ return F(a.n*b.d-b.n*a.d,a.d*b.d); }
function fmul(a,b){ return F(a.n*b.n,a.d*b.d); }
function fdiv(a,b){ return F(a.n*b.d,a.d*b.n); }
function fv(f){ return f.n/f.d; }
function fs(f){ return f.d===1?sg(f.n):(f.n<0?MIN:'')+Math.abs(f.n)+'/'+f.d; }
function fmix(f){ if(f.d===1) return sg(f.n); const neg=f.n<0, a=Math.abs(f.n), w=Math.floor(a/f.d), r=a%f.d; return (neg?MIN:'')+(w?w+' ':'')+r+'/'+f.d; }
function dec2(x){ return Math.abs(Math.round(x*100)-x*100)<1e-7; }
const GENS=[];
function G(key,unit,lvl,pola,kind,fn){ GENS.push({key,unit,fn}); }
G('k-persen','MD-16','L',null,'kilat',()=>{ const p=RN.pick([5,10,12.5,15,20,25,30,40,45,60,75,80,120,150]), b=40*RN.int(1,40); const v=p*b/100; return {perintah:fmt(p)+'% dari '+fmt(b),kunci:v,langkah:[fmt(p)+'% × '+fmt(b)+' = '+fmt(p)+'/100 × '+fmt(b)+' = '+fmt(v)]}; });
G('k-pecahan','MD-13','L',null,'kilat',()=>{ const b=RN.pick([3,4,5,6,8,12]); let a; do{ a=RN.int(1,b-1); }while(gcd(a,b)!==1); const N=b*RN.int(3,40); const v=a*N/b; return {perintah:a+'/'+b+' dari '+fmt(N),kunci:v,langkah:[fmt(N)+' ÷ '+b+' = '+fmt(N/b),fmt(N/b)+' × '+a+' = '+fmt(v)]}; });
G('k-pec-persen','MD-16','L',null,'kilat',()=>{ const b=RN.pick([2,4,5,8,20,25,40]); let a; do{ a=RN.int(1,b-1); }while(gcd(a,b)!==1); const v=a*100/b; return {perintah:a+'/'+b+' = … %',kunci:v,langkah:[a+'/'+b+' × 100% = '+fmt(v)+'%']}; });
G('k-operasi','MD-02','L',null,'kilat',()=>{ const c=RN.int(2,9), b=c*RN.int(2,12), d=RN.int(2,6), a=RN.int(20,99), e=RN.int(1,20); const v=a-(b/c)*d+e; return {perintah:a+' − '+b+' ÷ '+c+' × '+d+' + '+e,kunci:v,langkah:['Bagi dan kali dulu dari kiri: '+b+' ÷ '+c+' × '+d+' = '+fmt(b/c*d),a+' − '+fmt(b/c*d)+' + '+e+' = '+fmt(v)]}; });
G('k-negatif','MD-02','L',null,'kilat',()=>{ const a=RN.int(2,12), b=RN.int(2,12), c=RN.int(5,60); const v=-a*b+c; return {perintah:'('+MIN+a+') × '+b+' − ('+MIN+c+')',kunci:v,langkah:['('+MIN+a+') × '+b+' = '+sg(-a*b),'Kurang negatif = tambah: '+sg(-a*b)+' + '+c+' = '+sg(v)]}; });
G('k-kali','MD-02','L',null,'kilat',()=>{ const [x,y]=RN.pick([[25,4],[125,8],[50,2],[4,25],[8,125]]), N=RN.int(11,99); const v=x*N*y; return {perintah:x+' × '+N+' × '+y,kunci:v,langkah:['Pasangkan dulu '+x+' × '+y+' = '+(x*y),(x*y)+' × '+N+' = '+fmt(v)]}; });
G('k-kuadrat','MD-22','L',null,'kilat',()=>{ const t=RN.int(0,2); if(t===0){ const n=RN.int(11,25); return {perintah:n+'²',kunci:n*n,langkah:[n+' × '+n+' = '+fmt(n*n)]}; } if(t===1){ const n=RN.int(5,10); return {perintah:'2'+sup(n),kunci:Math.pow(2,n),langkah:['2'+sup(n)+' = '+fmt(Math.pow(2,n))]}; } const n=RN.int(3,6); return {perintah:'3'+sup(n),kunci:Math.pow(3,n),langkah:['3'+sup(n)+' = '+fmt(Math.pow(3,n))]}; });
G('k-fpb','MD-02','L',null,'kilat',()=>{ const g=RN.int(2,12); let m,n; do{ m=RN.int(2,9); n=RN.int(2,9); }while(m===n||gcd(m,n)!==1); return {perintah:'FPB('+g*m+', '+g*n+')',kunci:g,langkah:[g*m+' = '+g+' × '+m+', '+g*n+' = '+g+' × '+n,'Faktor bersama terbesar = '+g]}; });
G('k-kpk','MD-02','L',null,'kilat',()=>{ let a,b; do{ a=RN.int(4,30); b=RN.int(4,30); }while(a===b||lcm(a,b)>300||lcm(a,b)===Math.max(a,b)); const v=lcm(a,b); return {perintah:'KPK('+a+', '+b+')',kunci:v,langkah:['KPK = '+a+' × '+b+' ÷ FPB = '+(a*b)+' ÷ '+gcd(a,b)+' = '+v]}; });
G('k-desimal','MD-15','L',null,'kilat',()=>{ if(RN.chance(.5)){ const a=RN.int(2,9)/10, b=RN.int(11,49)/10; const v=Math.round(a*b*100)/100; return {perintah:fmt(a)+' × '+fmt(b),kunci:v,langkah:[(a*10)+' × '+(b*10)+' = '+(a*10*b*10)+', lalu geser koma 2 tempat → '+fmt(v)]}; } const d=RN.pick([0.2,0.4,0.5,0.25,0.05]), k=RN.int(3,40); const n=Math.round(k*d*100)/100; return {perintah:fmt(n)+' ÷ '+fmt(d),kunci:k,langkah:['Kalikan pembilang dan penyebut dengan 100 agar pembagi bulat',fmt(Math.round(n*100))+' ÷ '+fmt(Math.round(d*100))+' = '+k]}; });

G('k-satuan','MD-29','L',null,'kilat',()=>{ const t=RN.int(0,2); if(t===0){ const km=RN.int(11,49)/10, m=RN.int(1,9)*10+RN.int(0,9)*100; const v=km*1000+m; return {perintah:fmt(km)+' km + '+fmt(m)+' m = … m',kunci:v,langkah:[fmt(km)+' km = '+fmt(km*1000)+' m',fmt(km*1000)+' + '+fmt(m)+' = '+fmt(v)]}; }
  if(t===1){ const kw=RN.int(1,5), kg=RN.int(5,95), on=RN.int(1,9)*5; const v=kw*100+kg+on/10; return {perintah:kw+' kuintal + '+kg+' kg + '+on+' ons = … kg',kunci:v,langkah:['1 kuintal = 100 kg, 1 ons = 0,1 kg',fmt(kw*100)+' + '+kg+' + '+fmt(on/10)+' = '+fmt(v)]}; }

G('k-untung','BIL-19','L',null,'kilat',()=>{ const B=RN.pick([20,40,50,80,200])*1000, p=RN.pick([10,20,25,50]); const v=B*(100+p)/100; return {perintah:'Beli '+fmt(B)+', untung '+p+'% → harga jual',kunci:v,langkah:[fmt(B)+' × '+(100+p)+'% = '+fmt(v)]}; });
G('k-rata','DAT-09','L',null,'kilat',()=>{ const n=RN.pick([4,5]), m=RN.int(5,20); const xs=[]; for(let i=0;i<n-1;i++) xs.push(m+RN.int(-4,4)); const last=m*n-xs.reduce((a,b)=>a+b,0); if(last<1) return null; xs.push(last); return {perintah:'Rata-rata '+RN.shuf(xs).join(', '),kunci:m,langkah:['Jumlah '+(m*n)+' ÷ '+n+' = '+m]}; });

/* ---------- Utilitas ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mx(s){ return esc(s).replace(/\^\(((?:[^()]|\([^()]*\))*)\)/g,'<sup>$1</sup>').replace(/\^(−?-?[0-9a-zA-Z.,/]+)/g,'<sup>$1</sup>'); }
function txt(s){ return mx(s).replace(/\n/g,'<br>'); }
function pct(a,b){ return b?Math.round(a*100/b):0; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dk(ts){ return ymd(new Date(ts)); }
function fromYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dayNo(d){ d=new Date(d||Date.now()); d.setHours(0,0,0,0); return Math.round((d-new Date(2026,10,2))/DAY); }
function addDays(d,n){ d=new Date(d); d.setDate(d.getDate()+n); return d; }
function tgl(s,long){ return fromYmd(s).toLocaleDateString('id-ID',long?{weekday:'long',day:'numeric',month:'short'}:{day:'numeric',month:'short'}); }
function mmss(ms){ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.hidden=true; },2600); }
function parseNum(s){
  s=String(s==null?'':s).trim().replace(/\s/g,'').replace(/−/g,'-').replace(/^Rp/i,''); if(!s||s==='-') return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;
}

/* ---------- Jadwal materi (ikut Progres Harian) ----------
   Unit = subbab di jadwal Progres Harian (BIL-01, ALJ-03, U3-PU1, ...). Unit terbuka sejak bagian pertamanya dijadwalkan
   atau ditandai selesai. Tanggal mengikuti penundaan di Progres Harian lewat localStorage 'ph.jadwal'. */
function phJadwal(){ try{ const j=JSON.parse(localStorage.getItem('ph.jadwal')||'null'); return j&&j.unit2?j:null; }catch(e){ return null; } }
function lesDate(l,J){ return J&&(l[0] in J.unit2)?J.unit2[l[0]]:l[1]; }
function learned(u,k,J){ return u.les.filter(l=>{ const d=lesDate(l,J); return (d&&d<=k)||(J&&J.selesai2&&J.selesai2.includes(l[0])); }).length; }
function openUnits(date){ if(S.semua) return UNITS.map(u=>u.id); const k=ymd(date||new Date()), J=phJadwal(); return UNITS.filter(u=>learned(u,k,J)>0).map(u=>u.id); }
function oldUnits(date){ if(S.semua||S.ulas===false) return []; const open=openUnits(date); return OLD.filter(u=>!(V13[u.id]?V13[u.id][0]:[]).some(p=>open.includes(p))).map(u=>u.id); }
function poolUnits(date){ const p=openUnits(date).concat(oldUnits(date)); return p.length?p:[UNITS[0].id]; }
/* unit terbuka + padanan kode baru dari unit jadwal lama, untuk mengecek prasyarat bentuk arsip dan hitung cepat */
function eqUnits(date){ const p=poolUnits(date), out=new Set(p); p.forEach(u=>{ if(V13[u]) V13[u][0].forEach(x=>out.add(x)); }); return out; }
function lastDate(u,k,J){ let b=null; u.les.forEach(l=>{ const d=lesDate(l,J); if(d&&d<=k&&(!b||d>b)) b=d; }); return b; }
function fokusUnits(date){ const k=ymd(date||new Date()), J=phJadwal(); const now=UNITS.filter(u=>u.les.some(l=>lesDate(l,J)===k)).map(u=>u.id); if(now.length) return now;
  let best=null, bd=null; UNITS.forEach(u=>{ const d=lastDate(u,k,J); if(d&&(!bd||d>=bd)){ bd=d; best=u.id; } }); return [best||UNITS[0].id]; }
function recentUnits(date){ const k=ymd(date||new Date()), lim=ymd(addDays(date||new Date(),-7)), J=phJadwal(); return UNITS.filter(u=>{ const d=lastDate(u,k,J); return d&&d>=lim; }).map(u=>u.id); }
function unameP(id,date){ const u=UMAP[id]; if(!u) return id; if(u.old) return uname(id)+' (ulasan, sudah dipelajari di jadwal lama)'; const n=learned(u,ymd(date),phJadwal()); return uname(id)+(!S.semua&&n&&n<u.les.length?' (baru '+n+' dari '+u.les.length+' bagian dipelajari)':''); }

/* ---------- Statistik ---------- */
function first(){ return S.hist.filter(x=>!x.rep); }
function stat(list){ const t=list.filter(x=>x.ms>0&&x.ms<30*60000); return {n:list.length,p:pct(list.filter(x=>x.ok).length,list.length),t:t.length?t.reduce((a,x)=>a+x.ms,0)/t.length/1000:0}; }
function weakUnits(date){ const pool=poolUnits(date), h=first(); return pool.map(u=>Object.assign({u},stat(h.filter(x=>x.unit===u).slice(-20)))).filter(x=>x.n>=4&&x.p<70).sort((a,b)=>a.p-b.p).map(x=>x.u); }

  const stim=(Array.isArray(st.stimulus)?st.stimulus:[]).map(g=>({id:String(g.id||''),judul:String(g.judul||''),teks:[].concat(g.teks||[]).map(String),tabel:Array.isArray(g.tabel)&&g.tabel.length?g.tabel.map(r=>[].concat(r).map(String)):null})).filter(g=>g.id);
  const L='ABCDE';
  const soal=st.soal.map((x,i)=>{ const no=i+1, E=t=>err.push('Soal '+no+': '+t);
    const q={no,sub:SUB[x.sub]?x.sub:(SUB[st.subtes]?st.subtes:null),kem:KEM[x.kemampuan]?x.kemampuan:'',jenis:JN[x.jenis]?x.jenis:(mode==='varian'?'varian':'geser'),bl:String(x.bentuk_lama||'').trim(),diubah:String(x.diubah||'').trim(),unit:String(x.unit||'').trim(),lvl:['L','M','H'].includes(x.level)?x.level:'M',sidik:String(x.sidik||'').trim().slice(0,120),

      tipe:x.tipe,perintah:String(x.perintah||'').trim(),langkah:[].concat(x.langkah||[]).map(String).filter(Boolean),jebakan:String(x.jebakan||'').trim()};

    if(!q.perintah) E('"perintah" kosong.');
    if(q.stim&&!stim.some(g=>g.id===q.stim)) E('stimulus "'+q.stim+'" tidak ada di daftar stimulus.');
    const k=String(x.kunci==null?'':x.kunci).trim().toUpperCase();
    if(q.tipe==='pg'){ q.opsi=[].concat(x.opsi||[]).map(String); if(q.opsi.length!==5) E('pilihan ganda harus 5 opsi.'); q.kunci=L.indexOf(k); if(k.length!==1||q.kunci<0||q.kunci>=q.opsi.length) E('kunci harus huruf A–E.'); q.alasan=[].concat(x.alasan||[]).map(String); }
    else if(q.tipe==='pq'){ q.p=String(x.p||'').trim(); q.q=String(x.q||'').trim(); if(!q.p||!q.q) E('isi "p" dan "q".'); q.kunci=L.indexOf(k); if(k.length!==1||q.kunci<0||q.kunci>3) E('kunci P–Q harus A–D.'); q.alasan=[].concat(x.alasan||[]).map(String); }
    else if(q.tipe==='cukup'){ q.pern=[].concat(x.pernyataan||[]).map(String); if(q.pern.length!==2) E('kecukupan data butuh tepat 2 pernyataan.'); q.kunci=L.indexOf(k); if(k.length!==1||q.kunci<0) E('kunci harus huruf A–E.'); q.alasan=[].concat(x.alasan||[]).map(String); }
    else if(q.tipe==='bs'){ q.bs=[].concat(x.pernyataan||[]).map(p=>({teks:String(p&&p.teks||''),benar:p&&p.benar})); if(q.bs.length<3||q.bs.length>4||q.bs.some(p=>!p.teks||typeof p.benar!=='boolean')) E('benar/salah butuh 3 pernyataan dengan "teks" dan "benar": true/false.'); }

  if(err.length) return {err,warn};

  else if(mode==='sim'){ sub=soal[0].sub; id='sim'+now; label='Simulasi '+sub; if(soal.some(q=>q.sub!==sub)) warn.push('Simulasi memuat lebih dari satu subtes.'); }
  else { sub=soal[0].sub; id='var'+now; label='Varian '+sub; }

}
function addSet(st){
  const old=S.sets.find(x=>x.id===st.id);
  if(old){ if(S.hist.some(h=>h.sid===old.id)){ st.id=st.id+'-'+Date.now().toString(36).slice(-4); st.label+=' (tambahan)'; st.soal.forEach(q=>{ q.qid=st.id+'#'+q.no; }); } else S.sets=S.sets.filter(x=>x!==old); }
  S.sets.push(st); if(S.sets.length>80) S.sets=S.sets.slice(-80); save();
}
function setProg(st){ const done=new Set(S.hist.filter(h=>h.sid===st.id&&!h.rep).map(h=>h.qid)); return {n:st.soal.length,a:done.size}; }
function findQ(qid){ const sid=qid.split('#')[0], st=S.sets.find(x=>x.id===sid); if(!st) return null; const q=st.soal.find(x=>x.qid===qid); return q?{q,set:st}:null; }
function salahList(){ const lastBy={}; S.hist.forEach(h=>{ lastBy[h.qid]=h; }); return Object.values(lastBy).filter(h=>!h.ok&&!S.lunas[h.qid]).map(h=>findQ(h.qid)).filter(Boolean).reverse(); }

/* ---------- Tugas harian ---------- */
function harianSet(k){ return S.sets.filter(s=>s.mode==='harian'&&s.tgl===k).sort((a,b)=>a.ts-b.ts)[0]||null; }
function tasksOn(date){ const k=ymd(date);
  const kil=S.kil.filter(x=>dk(x.ts)===k).length, st=harianSet(k), pr=st?setProg(st):{n:16,a:0};
  const redo=S.hist.filter(h=>h.rep&&dk(h.ts)===k).length+Object.values(S.lunas).filter(t=>dk(t)===k).length, pend=salahList().length;
  return [
    {id:'kilat',t:'Hitung cepat',d:'20 isian kilat, target 20 detik per soal',cur:Math.min(kil,20),n:20,act:'kilat',btn:'Mulai'},
    {id:'set',t:'Set hari ini',d:st?pr.n+' soal: PU, PK, dan PM dengan bentuk yang diputar':'Belum ada set. Salin prompt, jalankan di Claude, tempel hasilnya.',cur:pr.a,n:pr.n,act:st?'mulai':'gosoal',v:st?st.id:'',btn:st?(pr.a?'Lanjut':'Mulai'):'Siapkan'},
    {id:'salah',t:'Ulang soal salah',d:pend?pend+' soal menunggu diulang':'Tidak ada soal salah yang menunggu',cur:pend?Math.min(redo,3):3,n:3,act:'ulang',btn:'Ulang',off:!pend}
  ].map(x=>Object.assign(x,{done:x.cur>=x.n}));
}
function dayFull(d){ const k=ymd(d), st=harianSet(k); return !!st&&setProg(st).a>=st.soal.length&&S.kil.filter(x=>dk(x.ts)===k).length>=20; }
function streak(){ let n=0, d=new Date(); d.setHours(0,0,0,0); if(!dayFull(d)) d=addDays(d,-1); while(n<400&&dayFull(d)){ n++; d=addDays(d,-1); } return n; }

/* ---------- Sesi soal ---------- */
const V={run:null,kl:null,hasil:null,soal:{tab:'harian',tgl:null,paste:'',res:null},prog:{}};
function newRun(o){ o.A=o.items.map(it=>({c:null,is:'',bs:it.q.tipe==='bs'?it.q.bs.map(()=>null):null,done:false,ok:false})); o.T=o.items.map(()=>0); o.cur=0; o.t0=Date.now(); o.started=Date.now(); return o; }
function startSet(st,again){ const pr=setProg(st); const items=st.soal.map(q=>({q,set:st}));
  const R=newRun({sid:st.id,label:st.label,mode:st.mode,items,cek:st.mode==='sim'?'akhir':S.cek,limit:st.mode==='sim'?SUB[st.sub].simMs:null,rep:pr.a>=pr.n||!!again});
  if(!R.rep&&pr.a){ const hs={}; S.hist.filter(h=>h.sid===st.id&&!h.rep).forEach(h=>{ hs[h.qid]=h; }); items.forEach((it,i)=>{ const h=hs[it.q.qid]; if(h){ R.A[i].done=true; R.A[i].ok=h.ok; R.A[i].prev=true; R.T[i]=h.ms; } }); const nx=R.A.findIndex(a=>!a.done); R.cur=nx<0?0:nx; }
  V.run=R; V.hasil=null; persist(); go('main'); }
function startUlang(list){ if(!list.length){ toast('Tidak ada soal salah yang menunggu.'); return; } V.run=newRun({sid:'ulang',label:'Ulang soal salah',mode:'ulang',items:list.slice(0,10),cek:'langsung',limit:null,rep:true}); V.hasil=null; persist(); go('main'); }
function isAns(q,a){ return q.tipe==='isian'?!isNaN(parseNum(a.is)):q.tipe==='bs'?a.bs.every(x=>x!==null):a.c!=null; }
function grade(q,a){ if(q.tipe==='isian') return Math.abs(parseNum(a.is)-q.kunciNum)<1e-9; if(q.tipe==='bs') return q.bs.every((r,i)=>a.bs[i]===r.benar); return a.c===q.kunci; }
function tick(R){ if(!R||R.fin) return; const now=Date.now(); if(!R.A[R.cur].done) R.T[R.cur]+=Math.min(now-R.t0,10*60000); R.t0=now; }
function recordAt(i){ const R=V.run, it=R.items[i], q=it.q, a=R.A[i]; if(a.done) return; a.done=true; a.ok=isAns(q,a)&&grade(q,a);
  S.hist.push({qid:q.qid,sid:it.set.id,sub:q.sub,kem:q.kem,jenis:q.jenis,bl:q.bl,unit:q.unit,ok:a.ok,ms:R.T[i],ts:Date.now(),mode:R.mode,rep:R.rep?1:0,ks:isAns(q,a)?0:1});
  if(a.ok&&S.lunas[q.qid]) delete S.lunas[q.qid]; }
function finishRun(){ const R=V.run; if(!R||R.fin) return; tick(R); R.items.forEach((_,i)=>{ if(!R.A[i].done) recordAt(i); }); R.fin=true; save(); clearSesi(); V.hasil=R; V.run=null; render(); window.scrollTo(0,0); }
function timeLeft(R){ return R.limit?R.started+R.limit-Date.now():null; }
function persist(){ try{ const R=V.run; if(!R||R.fin){ localStorage.removeItem(SKEY); return; }
  localStorage.setItem(SKEY,JSON.stringify({day:ymd(new Date()),sid:R.sid,label:R.label,mode:R.mode,qids:R.items.map(it=>it.q.qid),A:R.A,T:R.T,cur:R.cur,cek:R.cek,limit:R.limit,started:R.started,rep:R.rep})); }catch(e){} }
function clearSesi(){ try{ localStorage.removeItem(SKEY); }catch(e){} }
function loadSesi(){ try{ const o=JSON.parse(localStorage.getItem(SKEY)||'null'); if(!o||o.day!==ymd(new Date())) return null; const items=o.qids.map(findQ); if(items.some(x=>!x)) return null;
  if(o.limit&&o.started+o.limit<Date.now()) return null; return Object.assign(o,{items,t0:Date.now()}); }catch(e){ return null; } }

/* ---------- Hitung cepat ---------- */
function kilatGens(){ const pool=eqUnits(); const ok=g=>pool.has(g.unit)||(V13[g.unit]?V13[g.unit][0]:[]).some(p=>pool.has(p)); let gs=GENS.filter(ok); if(!gs.length) gs=GENS.filter(g=>g.unit==='MD-02'); return gs; }
function kilatSet(n){ const pool=poolUnits(); let gs=kilatGens(); gs=RN.shuf(gs); const out=[]; let i=0, guard=0;
  while(out.length<n&&guard++<n*40){ const g=gs[i++%gs.length]; let it=null; try{ it=g.fn({open:pool}); }catch(e){} if(it&&isFinite(it.kunci)) out.push(Object.assign(it,{key:g.key})); } return out; }
function startKilat(){ V.kl={items:kilatSet(20),i:0,ans:'',fb:null,res:[],t0:Date.now(),done:false}; go('main'); }
function kilatCheck(){ const K=V.kl; if(!K||K.fb) return; const it=K.items[K.i], v=parseNum(K.ans); if(isNaN(v)) return; const ok=Math.abs(v-it.kunci)<1e-9, ms=Date.now()-K.t0;
  K.fb={ok,ms}; K.res.push({it,ok,ms}); S.kil.push({k:it.key,ok,ms,ts:Date.now()}); save(); render();
  if(ok){ clearTimeout(K._t); K._t=setTimeout(()=>{ if(V.kl===K&&K.fb) kilatNext(); },600); } }
function kilatNext(){ const K=V.kl; if(!K) return; clearTimeout(K._t); if(K.i>=K.items.length-1){ K.done=true; render(); return; } K.i++; K.ans=''; K.fb=null; K.t0=Date.now(); render(); }

function optBtn(i,label,R,k,rv){ const q=R.items[k].q, a=R.A[k]; let cls='opt'; if(a.c===i) cls+=' sel'; if(rv){ if(i===q.kunci) cls+=' good'; else if(a.c===i) cls+=' wrong'; }

  else h+='<div class="isi"><input id="isian" inputmode="decimal" autocomplete="off" placeholder="jawaban angka" value="'+esc(a.is)+'"'+(rv?' disabled':'')+'><span class="sm">Desimal pakai koma, tanpa satuan.</span></div>';

  else h+='<button class="btn pri grow" data-action="'+(last?'selesai':'next')+'" id="pbtn">'+(last?'Selesai dan periksa':'Lanjut')+'</button>';
  h+='</div>';
  return h;
}
function pembahasan(q,a){
  let key=q.tipe==='pg'?'ABCDE'[q.kunci]+'. '+q.opsi[q.kunci]:q.tipe==='pq'?PQ4[q.kunci]:q.tipe==='cukup'?CK5[q.kunci]:q.tipe==='bs'?q.bs.map((b,i)=>(i+1)+' '+(b.benar?'Benar':'Salah')).join(' · '):fmt(q.kunciNum);

  if(q.jebakan) h+='<p class="sm"><b>Jebakan:</b> '+mx(q.jebakan)+'</p>';
  h+='<p class="lbl">'+jbadge(q.jenis)+' Kemampuan: '+esc(q.kem||'–')+(q.bl?' · Bentuk lama terdekat: '+esc(q.bl):'')+(q.diubah&&q.diubah!=='-'?' · Yang diubah: '+esc(q.diubah):'')+'</p></div>';
  return h;
}

function viewKilat(){

  if(K.done){ const ok=K.res.filter(r=>r.ok).length, n=K.res.length, avg=n?K.res.reduce((s,r)=>s+r.ms,0)/n/1000:0;

  h+='<div class="card kl'+(K.fb?(K.fb.ok?' good':' wrong'):'')+'"><span class="sm">Soal '+(K.i+1)+' dari '+n+'</span><p class="klq">'+mx(it.perintah)+'</p>';
  if(K.fb) h+='<p class="kunci">'+(K.fb.ok?'Benar':'Kunci: '+esc(fmt(it.kunci)))+'</p>'+(K.fb.ok?'':'<ol class="steps">'+it.langkah.map(s=>'<li>'+mx(s)+'</li>').join('')+'</ol>')+'<button class="btn pri block" data-action="klnext" id="pbtn">Lanjut</button>';

function render(){
  let r=route(), h, full=false;
  if(r==='main'){ if(V.run){ h=viewRun(); full=true; } else if(V.kl){ h=viewKilat(); full=true; } else if(V.hasil){ h=viewHasil(); full=true; } else { r='beranda'; } }
  if(!h) h=r==='soal'?viewSoal():r==='salah'?viewSalah():r==='progres'?viewProgres():viewBeranda();
  $('#view').innerHTML=h; $('#nav').hidden=full;
  $('#nav').innerHTML=NAV.map(x=>'<a href="#'+x[0]+'"'+(r===x[0]?' class="on"':'')+'>'+x[1]+(x[0]==='salah'&&salahList().length?'<i>'+salahList().length+'</i>':'')+'</a>').join('');
  const f=$('#klans')||(V.run&&!V.run.A[V.run.cur].done?$('#isian'):null); if(f&&!('ontouchstart' in window)) f.focus();
}

/* ---------- Aksi ---------- */
function act(a,v){
  const R=V.run, K=V.kl, Z=V.soal;
  if(a!=='reset') V.prog.reset=false;
  if(a==='kilat') startKilat();
  else if(a==='gosoal'){ Z.tab='harian'; Z.tgl=ymd(new Date()); Z.res=null; go('soal'); }
  else if(a==='gosim'){ Z.tab=v; Z.res=null; go('soal'); }
  else if(a==='mulai'){ const st=S.sets.find(x=>x.id===v); if(st) startSet(st); }
  else if(a==='resume'){ const o=loadSesi(); if(o){ V.run=o; V.hasil=null; go('main'); } }
  else if(a==='ulang') startUlang(salahList());
  else if(a==='ulang1'){ const it=findQ(v); if(it) startUlang([it]); }
  else if(a==='varian'){ const it=findQ(v); if(it) copyText(promptVarian(it.q,it.set),'Prompt varian disalin. Tempel hasilnya di Set soal.'); }
  else if(a==='paham'){ S.lunas[v]=Date.now(); save(); render(); }
  else if(a==='tab'){ Z.tab=v; Z.res=null; render(); }
  else if(a==='tgl'){ Z.tgl=v; render(); }
  else if(a==='copy'){ copyText($('#promptbox').value,'Prompt disalin. Jalankan di Claude.'); }
  else if(a==='acak'){ if(Z.tab==='harian') buildResep(Z.tgl,fromYmd(Z.tgl),PLAN.harian,'harian'); else resepSim(Z.tab,true); render(); toast('Resep diacak ulang.'); }
  else if(a==='simpan'){ Z.paste=$('#paste').value; const res=parseSet(Z.paste); if(res.err.length){ Z.res=res; } else { addSet(res.set); Z.paste=''; Z.res={ok:res.set.label+' tersimpan: '+res.set.soal.length+' soal.',warn:res.warn}; } render(); }
  else if(a==='hapus'){ if(V._del===v){ S.sets=S.sets.filter(x=>x.id!==v); V._del=null; save(); render(); } else { V._del=v; toast('Tekan × sekali lagi untuk menghapus set ini.'); } }
  else if(a==='cek'){ S.cek=S.cek==='langsung'?'akhir':'langsung'; save(); render(); }
  else if(a==='tema'){ S.tema=S.tema==='terang'?'gelap':S.tema==='gelap'?'auto':'terang'; applyTema(); save(); render(); }
  else if(a==='ulas'){ S.ulas=S.ulas===false; save(); render(); }
  else if(a==='semua'){ S.semua=!S.semua; save(); render(); }
  else if(a==='ekspor'){ copyText(JSON.stringify(S),'Data disalin.'); }
  else if(a==='reset'){ if(V.prog.reset){ S=Object.assign(fresh(),{tema:S.tema}); V.prog.reset=false; clearSesi(); save(); toast('Semua data dihapus.'); } else V.prog.reset=true; render(); }
  else if(R&&a==='pick'){ if(R.A[R.cur].done) return; R.A[R.cur].c=+v; persist(); render(); }
  else if(R&&a==='bs'){ if(R.A[R.cur].done) return; const [i,b]=v.split(':'); R.A[R.cur].bs[+i]=b==='1'; persist(); render(); }
  else if(R&&a==='periksa'){ tick(R); recordAt(R.cur); save(); persist(); render(); }
  else if(R&&(a==='next'||a==='prev'||a==='ke')){ tick(R); const n=R.items.length; let to=a==='ke'?+v:a==='prev'?R.cur-1:R.cur+1; if(a==='next'&&to>=n){ to=R.A.findIndex(x=>!x.done); if(to<0) to=n-1; } R.cur=Math.max(0,Math.min(n-1,to)); R.t0=Date.now(); persist(); render(); window.scrollTo(0,0); }
  else if(R&&a==='selesai'){ finishRun(); }
  else if(R&&a==='keluar'){ tick(R); persist(); V.run=null; go('beranda'); toast('Sesi disimpan. Lanjutkan dari Beranda.'); }
  else if(K&&a==='klcheck') kilatCheck();
  else if(K&&a==='klnext') kilatNext();
  else if(K&&a==='klneg'){ const i=$('#klans'); K.ans=i.value.trim().startsWith('-')||i.value.trim().startsWith('−')?i.value.trim().slice(1):'−'+i.value.trim(); render(); }
  else if(K&&a==='klstop'){ if(K.res.length){ K.done=true; render(); } else { V.kl=null; go('beranda'); } }
  else if(a==='klclose'){ V.kl=null; go('beranda'); }
}

document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='isian'&&V.run){ V.run.A[V.run.cur].is=t.value; const p=$('#pbtn'); if(p&&V.run.cek==='langsung') p.disabled=isNaN(parseNum(t.value)); persist(); }
  else if(t.id==='klans'&&V.kl){ V.kl.ans=t.value; const p=$('#pbtn'); if(p) p.disabled=isNaN(parseNum(t.value)); }
  else if(t.id==='paste') V.soal.paste=t.value; });
document.addEventListener('keydown',e=>{ if(e.key!=='Enter'||e.target.tagName==='TEXTAREA') return; const p=$('#pbtn'); if(p&&!p.disabled&&route()==='main'){ e.preventDefault(); p.click(); } });
window.addEventListener('hashchange',()=>{ if(route()!=='main'){ if(V.run){ tick(V.run); persist(); V.run=null; } V.kl=null; V.hasil=null; } render(); });
setInterval(()=>{ const R=V.run, K=V.kl;
  if(R&&route()==='main'){ const el=$('#tm'), left=timeLeft(R); if(left!=null){ if(left<=0){ finishRun(); toast('Waktu habis.'); return; } if(el){ el.textContent=mmss(left); el.classList.toggle('late',left<60000); } }
    else if(el){ const a=R.A[R.cur], ms=R.T[R.cur]+(a.done?0:Date.now()-R.t0); el.textContent=mmss(ms); el.classList.toggle('late',!a.done&&ms>SUB[R.items[R.cur].q.sub].dtk*1000); } }
